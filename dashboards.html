<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboards — Studio</title>
  <style>
    /* ── Tokens (match studio app) ──────────────────────────────── */
    :root {
      --bg:         #0b0f14;
      --surface:    #161b22;
      --surface-2:  #1c2330;
      --border:     #272e38;
      --border-hi:  #3a4453;
      --text:       #cdd9e5;
      --text-dim:   #768390;
      --text-muted: #4d5768;
      --accent:     #58a6ff;
      --accent-dim: #1c3354;
      --green:      #3fb950;
      --orange:     #d29922;
      --red:        #f85149;
      --mono:       'JetBrains Mono','Fira Code',monospace;
      --sans:       -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --r:          6px;

      /* widget-type glyph colours */
      --c-kpi:        #58a6ff;
      --c-bar:        #3fb950;
      --c-line:       #d29922;
      --c-pie:        #bc8cff;
      --c-stack:      #39d5ff;
    }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:     var(--sans);
      background:      var(--bg);
      color:           var(--text);
      min-height:      100dvh;
      display:         flex;
      flex-direction:  column;
    }

    /* ── Topbar ─────────────────────────────────────────────────── */
    #topbar {
      height:        48px;
      flex-shrink:   0;
      background:    var(--surface);
      border-bottom: 1px solid var(--border);
      display:       flex;
      align-items:   center;
      padding:       0 20px;
      gap:           12px;
      position:      sticky;
      top:           0;
      z-index:       50;
    }
    .logo {
      font-family:    var(--mono);
      font-size:      12px;
      font-weight:    700;
      color:          var(--accent);
      letter-spacing: .06em;
      text-decoration: none;
    }
    .top-sep { width:1px; height:16px; background:var(--border); }
    .page-title {
      font-size:   12px;
      font-weight: 600;
      color:       var(--text-dim);
    }
    .new-btn {
      margin-left:   auto;
      background:    #2388ff;
      color:         #fff;
      border:        1px solid #3b9cff;
      border-radius: var(--r);
      font-size:     11px;
      font-weight:   700;
      padding:       5px 14px;
      cursor:        pointer;
      display:       flex;
      align-items:   center;
      gap:           6px;
      text-decoration: none;
      transition:    background .15s, box-shadow .15s;
      box-shadow:    0 0 10px rgba(35,136,255,.2);
    }
    .new-btn:hover { background:#3b9cff; box-shadow:0 0 16px rgba(88,166,255,.35); }

    /* ── Page body ──────────────────────────────────────────────── */
    #content {
      flex:    1;
      padding: 32px 28px 48px;
      max-width: 1200px;
      width:   100%;
      margin:  0 auto;
    }

    /* ── Section header ─────────────────────────────────────────── */
    .section-hdr {
      display:       flex;
      align-items:   baseline;
      gap:           10px;
      margin-bottom: 20px;
    }
    .section-hdr h1 {
      font-size:   18px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .count-pill {
      font-family:    var(--mono);
      font-size:      10px;
      font-weight:    700;
      color:          var(--text-muted);
      background:     var(--surface-2);
      border:         1px solid var(--border);
      padding:        1px 8px;
      border-radius:  20px;
    }

    /* ── Search bar ─────────────────────────────────────────────── */
    #search-wrap {
      margin-bottom: 22px;
      position:      relative;
      max-width:     320px;
    }
    #search-icon {
      position:  absolute;
      left:      10px;
      top:       50%;
      transform: translateY(-50%);
      color:     var(--text-muted);
      pointer-events: none;
    }
    #search {
      width:         100%;
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--r);
      color:         var(--text);
      font-family:   var(--sans);
      font-size:     12px;
      padding:       7px 10px 7px 30px;
      outline:       none;
      transition:    border-color .15s;
    }
    #search::placeholder { color: var(--text-muted); }
    #search:focus { border-color: var(--accent); }

    /* ── Grid ───────────────────────────────────────────────────── */
    #grid {
      display:               grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:                   16px;
    }

    /* ── Dashboard card ─────────────────────────────────────────── */
    .dash-card {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--r);
      display:       flex;
      flex-direction: column;
      overflow:      hidden;
      cursor:        pointer;
      transition:    border-color .18s, box-shadow .18s, transform .18s;
      text-decoration: none;
      color:         inherit;
    }
    .dash-card:hover {
      border-color: var(--border-hi);
      box-shadow:   0 6px 24px rgba(0,0,0,.45);
      transform:    translateY(-2px);
    }

    /* Signature element: widget-type composition preview */
    .card-preview {
      height:     96px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display:    flex;
      align-items: center;
      justify-content: center;
      padding:    12px 16px;
      gap:        6px;
      position:   relative;
      overflow:   hidden;
    }
    /* faint dot grid inside preview */
    .card-preview::before {
      content:    '';
      position:   absolute;
      inset:      0;
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size:  16px 16px;
      opacity:    .4;
    }

    /* Individual widget glyph */
    .wg {
      position:    relative;
      z-index:     1;
      width:       44px;
      height:      56px;
      background:  var(--bg);
      border:      1px solid var(--border);
      border-radius: 4px;
      display:     flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding:     5px 4px 4px;
      gap:         2px;
      flex-shrink: 0;
    }
    .wg svg { width:100%; height:auto; display:block; }
    .wg-label {
      font-family:    var(--mono);
      font-size:      7px;
      letter-spacing: .05em;
      color:          var(--text-muted);
      text-transform: uppercase;
    }
    .wg.kpi    { border-color: var(--c-kpi);   }
    .wg.bar    { border-color: var(--c-bar);   }
    .wg.line   { border-color: var(--c-line);  }
    .wg.pie    { border-color: var(--c-pie);   }
    .wg.stack  { border-color: var(--c-stack); }

    /* +N overflow indicator */
    .wg-more {
      position:    relative;
      z-index:     1;
      width:       28px;
      height:      28px;
      background:  var(--surface);
      border:      1px solid var(--border);
      border-radius: 50%;
      display:     flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size:   9px;
      color:       var(--text-muted);
      align-self:  center;
    }

    /* Empty preview */
    .card-preview.empty-preview {
      justify-content: center;
    }
    .card-preview.empty-preview span {
      position:  relative;
      z-index:   1;
      font-size: 11px;
      color:     var(--text-muted);
      font-style: italic;
    }

    /* Card body */
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap:     8px;
      flex:    1;
    }
    .card-name {
      font-size:   14px;
      font-weight: 700;
      color:       var(--text);
      line-height: 1.3;
      /* truncate to 2 lines */
      display:            -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:           hidden;
    }
    .card-desc {
      font-size:   11px;
      color:       var(--text-dim);
      line-height: 1.5;
      display:            -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:           hidden;
    }
    .card-meta {
      display:     flex;
      align-items: center;
      gap:         10px;
      margin-top:  auto;
      padding-top: 6px;
      border-top:  1px solid var(--border);
    }
    .meta-chip {
      font-family:    var(--mono);
      font-size:      9px;
      letter-spacing: .05em;
      color:          var(--text-muted);
      display:        flex;
      align-items:    center;
      gap:            4px;
    }
    .meta-chip svg { opacity:.5; }
    .card-actions {
      margin-left: auto;
      display:     flex;
      gap:         4px;
    }
    .card-action-btn {
      background:    transparent;
      border:        1px solid transparent;
      border-radius: 4px;
      color:         var(--text-muted);
      font-size:     10px;
      padding:       3px 8px;
      cursor:        pointer;
      transition:    border-color .12s, color .12s, background .12s;
    }
    .card-action-btn:hover {
      border-color: var(--border-hi);
      color:        var(--text);
      background:   var(--surface-2);
    }
    .card-action-btn.del:hover {
      border-color: var(--red);
      color:        var(--red);
    }

    /* ── Empty state ─────────────────────────────────────────────── */
    #empty-state {
      display:        none;
      flex-direction: column;
      align-items:    center;
      justify-content: center;
      gap:            12px;
      padding:        80px 20px;
      text-align:     center;
    }
    #empty-state.visible { display:flex; }
    .empty-glyph {
      font-size: 36px;
      opacity:   .15;
    }
    .empty-headline {
      font-size:   16px;
      font-weight: 700;
      color:       var(--text-dim);
    }
    .empty-sub {
      font-size:   12px;
      color:       var(--text-muted);
      max-width:   280px;
      line-height: 1.6;
    }
    .empty-cta {
      margin-top:    4px;
      background:    #2388ff;
      color:         #fff;
      border:        none;
      border-radius: var(--r);
      font-size:     12px;
      font-weight:   700;
      padding:       8px 20px;
      cursor:        pointer;
      text-decoration: none;
      transition:    background .15s;
    }
    .empty-cta:hover { background:#3b9cff; }

    /* ── Loading skeleton ────────────────────────────────────────── */
    #loading {
      display:               grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:                   16px;
    }
    .skeleton-card {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--r);
      overflow:      hidden;
    }
    .skel-preview {
      height:     96px;
      background: var(--surface-2);
      animation:  pulse 1.4s ease-in-out infinite;
    }
    .skel-body { padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
    .skel-line {
      height:        10px;
      border-radius: 3px;
      background:    var(--surface-2);
      animation:     pulse 1.4s ease-in-out infinite;
    }
    .skel-line.wide  { width:70%; }
    .skel-line.mid   { width:50%; }
    .skel-line.short { width:30%; }
    @keyframes pulse {
      0%,100% { opacity:.5; }
      50%      { opacity:1;  }
    }

    /* ── Toast ───────────────────────────────────────────────────── */
    #toast {
      position:      fixed;
      bottom:        24px;
      right:         24px;
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--r);
      padding:       10px 16px;
      font-size:     12px;
      color:         var(--text);
      box-shadow:    0 8px 30px rgba(0,0,0,.5);
      transform:     translateY(80px);
      opacity:       0;
      transition:    transform .25s ease, opacity .25s ease;
      z-index:       100;
      pointer-events: none;
    }
    #toast.show { transform:translateY(0); opacity:1; }
    #toast.success { border-color:var(--green); color:var(--green); }
    #toast.error   { border-color:var(--red);   color:var(--red);   }

    /* ── Confirm delete modal ────────────────────────────────────── */
    #del-overlay {
      display:         none;
      position:        fixed;
      inset:           0;
      background:      rgba(0,0,0,.65);
      z-index:         200;
      align-items:     center;
      justify-content: center;
    }
    #del-overlay.visible { display:flex; }
    #del-modal {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: 8px;
      padding:       24px 28px;
      width:         340px;
      display:       flex;
      flex-direction: column;
      gap:           16px;
      box-shadow:    0 20px 60px rgba(0,0,0,.6);
    }
    #del-modal h3  { font-size:14px; font-weight:700; }
    #del-modal p   { font-size:11px; color:var(--text-dim); line-height:1.5; }
    .del-actions   { display:flex; gap:8px; justify-content:flex-end; }
    .del-cancel {
      background: transparent; border:1px solid var(--border);
      border-radius:5px; color:var(--text-dim); font-size:12px;
      padding:6px 14px; cursor:pointer; transition:border-color .12s,color .12s;
    }
    .del-cancel:hover { border-color:var(--border-hi); color:var(--text); }
    .del-confirm {
      background:#f85149; border:1px solid #ff6b63;
      border-radius:5px; color:#fff; font-size:12px; font-weight:700;
      padding:6px 16px; cursor:pointer; transition:background .12s;
    }
    .del-confirm:hover { background:#ff6b63; }
  </style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <a class="logo" href="/">◈ Dashboard Studio</a>
  <div class="top-sep"></div>
  <span class="page-title">Dashboards</span>
  <a class="new-btn" href="/">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
      <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    New Dashboard
  </a>
</div>

<!-- Content -->
<div id="content">

  <div class="section-hdr">
    <h1>Your Dashboards</h1>
    <span class="count-pill" id="count">—</span>
  </div>

  <div id="search-wrap">
    <svg id="search-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
      <circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 8l2.5 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <input id="search" type="text" placeholder="Filter dashboards…"/>
  </div>

  <!-- Skeletons while loading -->
  <div id="loading">
    <div class="skeleton-card"><div class="skel-preview"></div><div class="skel-body"><div class="skel-line wide"></div><div class="skel-line mid"></div><div class="skel-line short" style="margin-top:4px"></div></div></div>
    <div class="skeleton-card"><div class="skel-preview"></div><div class="skel-body"><div class="skel-line wide"></div><div class="skel-line mid"></div><div class="skel-line short" style="margin-top:4px"></div></div></div>
    <div class="skeleton-card"><div class="skel-preview"></div><div class="skel-body"><div class="skel-line wide"></div><div class="skel-line mid"></div><div class="skel-line short" style="margin-top:4px"></div></div></div>
  </div>

  <!-- Actual grid (hidden until loaded) -->
  <div id="grid" style="display:none"></div>

  <!-- Empty state -->
  <div id="empty-state">
    <div class="empty-glyph">⬡</div>
    <div class="empty-headline">No dashboards yet</div>
    <p class="empty-sub">Build a widget in the studio, then hit Publish to save your first dashboard here.</p>
    <a class="empty-cta" href="/">Open Studio</a>
  </div>

</div>

<!-- Delete confirm modal -->
<div id="del-overlay">
  <div id="del-modal">
    <h3>Delete Dashboard</h3>
    <p id="del-msg">Are you sure? This will permanently remove the dashboard and all its widgets.</p>
    <div class="del-actions">
      <button class="del-cancel" id="del-cancel">Cancel</button>
      <button class="del-confirm" id="del-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── Widget-type glyph SVGs ────────────────────────────────────────────
const GLYPHS = {
  BARCHART: (color) => `
    <svg viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2"  y="14" width="6" height="12" rx="1" fill="${color}cc"/>
      <rect x="10" y="8"  width="6" height="18" rx="1" fill="${color}"/>
      <rect x="18" y="4"  width="6" height="22" rx="1" fill="${color}cc"/>
      <rect x="26" y="10" width="6" height="16" rx="1" fill="${color}66"/>
      <line x1="2" y1="27" x2="34" y2="27" stroke="${color}44" stroke-width="1"/>
    </svg>`,
  STACKEDBAR: (color) => `
    <svg viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2"  y="16" width="6" height="10" rx="1" fill="${color}"/>
      <rect x="2"  y="10" width="6" height="6"  rx="1" fill="${color}88"/>
      <rect x="10" y="12" width="6" height="14" rx="1" fill="${color}"/>
      <rect x="10" y="6"  width="6" height="6"  rx="1" fill="${color}88"/>
      <rect x="18" y="8"  width="6" height="18" rx="1" fill="${color}"/>
      <rect x="18" y="2"  width="6" height="6"  rx="1" fill="${color}88"/>
      <line x1="2" y1="27" x2="34" y2="27" stroke="${color}44" stroke-width="1"/>
    </svg>`,
  LINECHART: (color) => `
    <svg viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 22 L10 14 L18 18 L26 6 L34 10" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M2 22 L10 14 L18 18 L26 6 L34 10 V27 H2Z" fill="${color}22"/>
      <circle cx="2"  cy="22" r="1.5" fill="${color}"/>
      <circle cx="10" cy="14" r="1.5" fill="${color}"/>
      <circle cx="18" cy="18" r="1.5" fill="${color}"/>
      <circle cx="26" cy="6"  r="1.5" fill="${color}"/>
      <circle cx="34" cy="10" r="1.5" fill="${color}"/>
    </svg>`,
  PIECHART: (color) => `
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="11" fill="none" stroke="${color}33" stroke-width="6"/>
      <circle cx="14" cy="14" r="11" fill="none" stroke="${color}" stroke-width="6"
              stroke-dasharray="22 47" stroke-dashoffset="0"/>
      <circle cx="14" cy="14" r="11" fill="none" stroke="${color}88" stroke-width="6"
              stroke-dasharray="15 54" stroke-dashoffset="-22"/>
      <circle cx="14" cy="14" r="5" fill="var(--surface-2)"/>
    </svg>`,
  KPI: (color) => `
    <svg viewBox="0 0 36 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="18" y="16" text-anchor="middle" font-family="monospace" font-size="14"
            font-weight="700" fill="${color}">42K</text>
      <line x1="2" y1="20" x2="34" y2="20" stroke="${color}33" stroke-width="1"/>
    </svg>`,
};

const TYPE_COLOR = {
  KPI:        'var(--c-kpi)',
  BARCHART:   'var(--c-bar)',
  STACKEDBAR: 'var(--c-stack)',
  LINECHART:  'var(--c-line)',
  PIECHART:   'var(--c-pie)',
};
const TYPE_LABEL = {
  KPI:'KPI', BARCHART:'BAR', STACKEDBAR:'STACK', LINECHART:'LINE', PIECHART:'PIE'
};

function resolveColor(cssVar) {
  return getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
}

// ── Build preview from widget list ────────────────────────────────────
function buildPreview(widgets) {
  const el = document.createElement('div');
  el.className = 'card-preview';

  if (!widgets || !widgets.length) {
    el.classList.add('empty-preview');
    const s = document.createElement('span');
    s.textContent = 'No widgets';
    el.appendChild(s);
    return el;
  }

  const shown = widgets.slice(0, 4);
  shown.forEach(w => {
    const type  = (w.widget_type || 'BARCHART').toUpperCase();
    const color = resolveColor(TYPE_COLOR[type] || '--c-bar');
    const glyphFn = GLYPHS[type] || GLYPHS.BARCHART;

    const wg = document.createElement('div');
    wg.className = 'wg ' + type.toLowerCase().replace('stackedbar','stack').replace('barchart','bar').replace('linechart','line').replace('piechart','pie').replace('kpi','kpi');
    wg.innerHTML = glyphFn(color) +
      `<span class="wg-label">${TYPE_LABEL[type] || type}</span>`;
    el.appendChild(wg);
  });

  if (widgets.length > 4) {
    const more = document.createElement('div');
    more.className = 'wg-more';
    more.textContent = '+' + (widgets.length - 4);
    el.appendChild(more);
  }

  return el;
}

// ── Format date ───────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 86400 * 7) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

// ── Toast ─────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ── Delete confirm ────────────────────────────────────────────────────
let pendingDeleteId = null;
const delOverlay = document.getElementById('del-overlay');
document.getElementById('del-cancel').addEventListener('click', () => {
  delOverlay.classList.remove('visible');
  pendingDeleteId = null;
});
delOverlay.addEventListener('click', e => {
  if (e.target === delOverlay) { delOverlay.classList.remove('visible'); pendingDeleteId = null; }
});
document.getElementById('del-confirm').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  delOverlay.classList.remove('visible');
  pendingDeleteId = null;
  try {
    const res = await fetch(`/dashboards/${id}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) throw new Error(`${res.status}`);
    showToast('Dashboard deleted.', 'success');
    // remove card from DOM immediately
    const card = document.querySelector(`[data-id="${id}"]`);
    if (card) card.remove();
    updateCount();
    checkEmpty();
  } catch (err) {
    showToast('Delete failed: ' + err.message, 'error');
  }
});

function confirmDelete(id, name, e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('del-msg').textContent =
    `Delete "${name}"? This will permanently remove the dashboard and all ${''} its widgets.`;
  pendingDeleteId = id;
  delOverlay.classList.add('visible');
}

// ── Build a single card ───────────────────────────────────────────────
function buildCard(dash) {
  const card = document.createElement('a');
  card.className  = 'dash-card';
  card.href       = `/?dashboard=${dash.id}`;
  card.dataset.id = dash.id;
  card.dataset.name = (dash.name || '').toLowerCase();

  // Preview
  card.appendChild(buildPreview(dash.widgets || []));

  // Body
  const body = document.createElement('div');
  body.className = 'card-body';

  const name = document.createElement('div');
  name.className   = 'card-name';
  name.textContent = dash.name || 'Untitled';
  body.appendChild(name);

  if (dash.description) {
    const desc = document.createElement('div');
    desc.className   = 'card-desc';
    desc.textContent = dash.description;
    body.appendChild(desc);
  }

  // Meta row
  const meta = document.createElement('div');
  meta.className = 'card-meta';

  const wCount = document.createElement('span');
  wCount.className = 'meta-chip';
  wCount.innerHTML =
    `<svg width="10" height="10" viewBox="0 0 12 12" fill="none">
       <rect x="1" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
       <rect x="7" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
       <rect x="1" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
       <rect x="7" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
     </svg>${(dash.widgets || []).length} widget${(dash.widgets||[]).length !== 1 ? 's' : ''}`;
  meta.appendChild(wCount);

  const ts = document.createElement('span');
  ts.className   = 'meta-chip';
  ts.textContent = fmtDate(dash.created_at);
  meta.appendChild(ts);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const delBtn = document.createElement('button');
  delBtn.className   = 'card-action-btn del';
  delBtn.textContent = 'Delete';
  delBtn.addEventListener('click', (e) => confirmDelete(dash.id, dash.name, e));
  actions.appendChild(delBtn);

  meta.appendChild(actions);
  body.appendChild(meta);
  card.appendChild(body);

  return card;
}

// ── Count + empty state helpers ───────────────────────────────────────
function updateCount() {
  const visible = document.querySelectorAll('#grid .dash-card:not([style*="display: none"])');
  document.getElementById('count').textContent = visible.length;
}

function checkEmpty() {
  const cards = document.querySelectorAll('#grid .dash-card');
  const emptyState = document.getElementById('empty-state');
  if (!cards.length) {
    document.getElementById('grid').style.display = 'none';
    emptyState.classList.add('visible');
  } else {
    document.getElementById('grid').style.display = 'grid';
    emptyState.classList.remove('visible');
  }
}

// ── Search filter ─────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('#grid .dash-card').forEach(card => {
    const match = !q || card.dataset.name.includes(q);
    card.style.display = match ? '' : 'none';
  });
  updateCount();
});

// ── Load dashboards ───────────────────────────────────────────────────
async function loadDashboards() {
  try {
    // Fetch all dashboard summaries, then enrich each with widget count
    // GET /dashboards returns list; GET /dashboards/{id} returns widgets too
    const res = await fetch('/dashboards');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const list = await res.json();   // [{id, name, description, created_at, updated_at}]

    // Fetch widget details for each dashboard in parallel (capped at 12 to avoid hammering)
    const enriched = await Promise.all(
      list.slice(0, 40).map(async d => {
        try {
          const r = await fetch(`/dashboards/${d.id}`);
          return r.ok ? await r.json() : { ...d, widgets: [] };
        } catch { return { ...d, widgets: [] }; }
      })
    );

    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('grid');

    if (!enriched.length) {
      document.getElementById('empty-state').classList.add('visible');
      document.getElementById('count').textContent = '0';
      return;
    }

    enriched.forEach(d => grid.appendChild(buildCard(d)));
    grid.style.display = 'grid';
    updateCount();

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty-state').classList.add('visible');
    showToast('Could not load dashboards: ' + err.message, 'error');
  }
}

// ── Check for success redirect toast ─────────────────────────────────
// When redirected from publish, show a brief success toast
const params = new URLSearchParams(window.location.search);
if (params.get('published')) {
  window.addEventListener('load', () => {
    showToast('Dashboard published successfully!', 'success');
    // Clean up URL
    history.replaceState({}, '', '/dashboards.html');
  });
}

loadDashboards();
</script>
