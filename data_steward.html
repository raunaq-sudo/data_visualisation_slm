<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ── Design tokens ───────────────────────────────────────────── */
    :root {
      --bg:         #0b0f14;
      --canvas-bg:  #0d1117;
      --surface:    #161b22;
      --surface-2:  #1c2330;
      --border:     #272e38;
      --border-hi:  #3a4453;
      --text:       #cdd9e5;
      --text-dim:   #768390;
      --text-muted: #4d5768;
      --accent:     #58a6ff;
      --accent-dim: #1c3354;
      --green:      #3fb950;
      --orange:     #d29922;
      --red:        #f85149;
      --sql-text:   #79c0ff;
      --mono:       'JetBrains Mono','Fira Code',monospace;
      --sans:       -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --r:          5px;
      --panel-w:    300px;
      --topbar-h:   44px;

      /* chart palette */
      --c0:#58a6ff;--c1:#3fb950;--c2:#d29922;--c3:#f85149;
      --c4:#bc8cff;--c5:#39d5ff;--c6:#ff7b72;--c7:#ffa657;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body {
      font-family: var(--sans);
      background:  var(--canvas-bg);
      color:       var(--text);
      height:      100dvh;
      display:     flex;
      flex-direction: column;
      overflow:    hidden;
    }

    /* ── Topbar ─────────────────────────────────────────────────── */
    #topbar {
      height:      var(--topbar-h);
      flex-shrink: 0;
      background:  var(--surface);
      border-bottom: 1px solid var(--border);
      display:     flex;
      align-items: center;
      padding:     0 14px;
      gap:         10px;
      z-index:     100;
    }
    .logo {
      font-family:    var(--mono);
      font-size:      12px;
      font-weight:    700;
      color:          var(--accent);
      letter-spacing: .06em;
    }
    .top-sep { width:1px; height:16px; background:var(--border); }
    .session-tag {
      font-family: var(--mono);
      font-size:   10px;
      color:       var(--text-muted);
    }
    #conn-wrap { margin-left:auto; display:flex; align-items:center; gap:6px; }
    #conn-dot  { width:7px; height:7px; border-radius:50%; background:var(--text-muted); transition:background .3s; }
    #conn-dot.live  { background:var(--green); box-shadow:0 0 5px var(--green); }
    #conn-dot.error { background:var(--red); }
    #conn-label { font-size:10px; color:var(--text-muted); }

    /* ── Theme switcher ─────────────────────────────────────────── */
    .theme-switcher {
      display:     flex;
      align-items: center;
      gap:         3px;
      padding:     3px;
      background:  var(--surface-2);
      border:      1px solid var(--border);
      border-radius: 6px;
    }
    .theme-btn {
      width:         26px;
      height:        26px;
      border:        none;
      border-radius: 4px;
      background:    transparent;
      cursor:        pointer;
      display:       flex;
      align-items:   center;
      justify-content: center;
      font-size:     13px;
      transition:    background .15s;
    }
    .theme-btn:hover  { background: var(--border); }
    .theme-btn.active { background: var(--accent); }

    /* ── Publish button ──────────────────────────────────────────── */
    .publish-btn {
      background:    #2388ff;
      color:         #ffffff;
      border:        1px solid #3b9cff;
      border-radius: var(--r);
      font-size:     11px;
      font-weight:   600;
      padding:       4px 12px;
      cursor:        pointer;
      display:       flex;
      align-items:   center;
      gap:           5px;
      white-space:   nowrap;
      transition:    background .15s, box-shadow .15s;
      box-shadow:    0 0 10px rgba(35,136,255,.25);
      flex-shrink:   0;
    }
    .publish-btn:hover  { background:#3b9cff; box-shadow:0 0 16px rgba(88,166,255,.4); }
    .publish-btn:active { transform:translateY(1px); }
    .publish-btn svg    { flex-shrink:0; }

    /* collapse toggle buttons in topbar */
    .tog-btn {
      background:  transparent;
      border:      1px solid var(--border);
      border-radius: var(--r);
      color:       var(--text-dim);
      font-size:   11px;
      padding:     3px 9px;
      cursor:      pointer;
      display:     flex;
      align-items: center;
      gap:         5px;
      transition:  border-color .15s, color .15s;
      white-space: nowrap;
    }
    .tog-btn:hover { border-color:var(--accent); color:var(--accent); }
    .tog-btn svg   { flex-shrink:0; }

    /* ── Main area ──────────────────────────────────────────────── */
    #main {
      flex:    1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ── Chat panel (left, collapsible) ─────────────────────────── */
    #chat-panel {
      width:      var(--panel-w);
      min-width:  var(--panel-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      transition: width .25s ease, min-width .25s ease, opacity .2s;
      z-index:    10;
    }
    #chat-panel.collapsed {
      width:     0;
      min-width: 0;
      opacity:   0;
      pointer-events: none;
    }

    .panel-header {
      flex-shrink: 0;
      padding:     9px 12px;
      font-size:   10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color:       var(--text-muted);
      border-bottom: 1px solid var(--border);
      display:     flex;
      align-items: center;
      justify-content: space-between;
    }

    #chat-box {
      flex:       1;
      overflow-y: auto;
      padding:    12px;
      display:    flex;
      flex-direction: column;
      gap:        8px;
      scroll-behavior: smooth;
    }
    #chat-box::-webkit-scrollbar { width:3px; }
    #chat-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .bubble {
      max-width:    92%;
      padding:      7px 11px;
      border-radius: var(--r);
      font-size:    12px;
      line-height:  1.6;
      word-break:   break-word;
    }
    .bubble.agent  { background:var(--surface-2); border:1px solid var(--border); align-self:flex-start; }
    .bubble.user   { background:var(--accent-dim); border:1px solid #2a4a7a; align-self:flex-end; }
    .bubble.system { align-self:center; color:var(--text-muted); font-size:10px; font-style:italic; background:transparent; border:none; }
    .bubble .blbl  { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
    .bubble.agent .blbl { color:var(--accent); }
    .bubble.user  .blbl { color:#8bc4ff; }

    /* Inline chart preview inside chat */
    .chat-chart-wrap {
      margin-top:    6px;
      background:    var(--bg);
      border:        1px solid var(--border);
      border-radius: var(--r);
      padding:       10px;
      position:      relative;
    }
    .chat-chart-wrap canvas { max-height:140px; }
    .chat-kpi-inline { text-align:center; padding:8px 0; }
    .chat-kpi-inline .kv { font-family:var(--mono); font-size:28px; font-weight:700; color:var(--accent); }
    .chat-kpi-inline .kl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
    .add-to-canvas-btn {
      position: absolute; top:6px; right:6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-dim);
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .add-to-canvas-btn:hover { border-color:var(--accent); color:var(--accent); }

    #input-row {
      flex-shrink: 0;
      display:     flex;
      gap:         6px;
      padding:     8px 10px;
      border-top:  1px solid var(--border);
    }
    #user-input {
      flex:        1;
      background:  var(--surface-2);
      border:      1px solid var(--border);
      border-radius: var(--r);
      color:       var(--text);
      font-family: var(--sans);
      font-size:   12px;
      padding:     6px 9px;
      outline:     none;
      transition:  border-color .15s;
    }
    #user-input:focus    { border-color:var(--accent); }
    #user-input:disabled { opacity:.4; }
    #send-btn {
      background:  var(--accent);
      color:       #0b0f14;
      border:      none;
      border-radius: var(--r);
      font-size:   12px;
      font-weight: 700;
      padding:     6px 14px;
      cursor:      pointer;
      transition:  opacity .15s;
    }
    #send-btn:hover:not(:disabled) { opacity:.85; }
    #send-btn:disabled { opacity:.3; cursor:default; }

    /* ── Canvas (middle) ────────────────────────────────────────── */
    #canvas-area {
      flex:     1;
      position: relative;
      overflow: hidden;
      /* signature element: dot grid */
      background-color:   var(--canvas-bg);
      background-image:   radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size:    24px 24px;
    }

    #canvas-empty {
      position:   absolute;
      inset:      0;
      display:    flex;
      flex-direction: column;
      align-items:    center;
      justify-content: center;
      gap:        8px;
      pointer-events: none;
      transition: opacity .3s;
    }
    #canvas-empty .empty-icon { font-size:28px; opacity:.15; }
    #canvas-empty p { font-size:12px; color:var(--text-muted); opacity:.5; }

    /* Draggable widget cards on canvas */
    .canvas-widget {
      position:   absolute;
      background: var(--surface);
      border:     1px solid var(--border);
      border-radius: var(--r);
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      min-width:  200px;
      min-height: 140px;
      /* resize handle built-in */
      resize:     none;
    }
    .canvas-widget:hover { border-color:var(--border-hi); }
    .canvas-widget.active { border-color:var(--accent); z-index:50; }
    .canvas-widget.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(88,166,255,.25);
    }
    .cw-header {
      flex-shrink:  0;
      padding:      6px 10px;
      background:   var(--surface-2);
      border-bottom:1px solid var(--border);
      display:      flex;
      align-items:  center;
      gap:          6px;
      cursor:       grab;
      user-select:  none;
    }
    .cw-header:active { cursor:grabbing; }
    .cw-type-badge {
      font-family:    var(--mono);
      font-size:      9px;
      font-weight:    700;
      letter-spacing: .08em;
      color:          var(--accent);
      background:     var(--accent-dim);
      padding:        1px 6px;
      border-radius:  3px;
    }
    .cw-title {
      font-size:     11px;
      color:         var(--text-dim);
      flex:          1;
      overflow:      hidden;
      text-overflow: ellipsis;
      white-space:   nowrap;
    }
    .cw-close {
      display: none;
    }
    

    .cw-body {
      flex:       1;
      padding:    10px;
      overflow:   hidden;
      display:    flex;
      align-items: center;
      justify-content: center;
    }
    .cw-body canvas { width:100% !important; height:100% !important; }

    /* KPI on canvas */
    .kpi-canvas {
      display:        flex;
      flex-direction: column;
      align-items:    center;
      justify-content: center;
      gap:            4px;
      width:          100%;
    }
    .kpi-canvas .kv { font-family:var(--mono); font-size:36px; font-weight:700; color:var(--accent); line-height:1; }
    .kpi-canvas .kl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; }
    .kpi-canvas .ks { font-size:10px; color:var(--text-muted); font-family:var(--mono); margin-top:4px; }

    /* ── Right inspector panel ──────────────────────────────────── */
    #inspector {
      width:      var(--panel-w);
      min-width:  var(--panel-w);
      background: var(--surface);
      border-left:1px solid var(--border);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      transition: width .25s ease, min-width .25s ease, opacity .2s;
      z-index:    10;
    }
    #inspector.collapsed {
      width:     0;
      min-width: 0;
      opacity:   0;
      pointer-events: none;
    }
    #inspector-scroll {
      flex:       1;
      overflow-y: auto;
      padding:    10px;
      display:    flex;
      flex-direction: column;
      gap:        10px;
    }
    #inspector-scroll::-webkit-scrollbar { width:3px; }
    #inspector-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    /* Inspector accordion sections */
    .insp-section { border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
    .insp-section-hdr {
      padding:        7px 10px;
      font-size:      9px;
      font-weight:    700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color:          var(--text-muted);
      background:     var(--surface-2);
      display:        flex;
      justify-content: space-between;
      align-items:    center;
      cursor:         pointer;
      user-select:    none;
      transition:     color .15s;
    }
    .insp-section-hdr:hover { color:var(--text); }
    .insp-section-hdr .chevron { transition:transform .2s; font-size:10px; }
    .insp-section.open .chevron { transform:rotate(180deg); }
    .insp-section-body { display:none; padding:10px; }
    .insp-section.open .insp-section-body { display:block; }

    /* Completeness meter */
    .meter-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
    .meter-val  { font-family:var(--mono); font-size:20px; font-weight:700; }
    .meter-gate { font-size:10px; font-weight:600; }
    .prog-track { background:var(--surface-2); border-radius:2px; height:5px; overflow:hidden; }
    .prog-fill  { height:100%; border-radius:2px; width:0%; background:var(--text-muted); transition:width .4s cubic-bezier(.4,0,.2,1),background .3s; }
    .step-labels { display:flex; justify-content:space-between; margin-top:3px; }
    .step-labels span { font-family:var(--mono); font-size:8px; color:var(--border); }

    /* Slots */
    .slot-row { padding:6px 0; border-bottom:1px solid var(--border); }
    .slot-row:last-child { border-bottom:none; }
    .slot-key { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px; }
    .slot-val  { font-family:var(--mono); font-size:11px; word-break:break-word; }
    .slot-val.empty  { color:var(--text-muted); font-style:italic; }
    .slot-val.filled { color:var(--green); }
    .badge { display:inline-block; font-size:9px; font-weight:700; letter-spacing:.05em; padding:2px 7px; border-radius:20px; text-transform:uppercase; }
    .badge.confirmed { background:#1a3a1f; color:var(--green); border:1px solid #2a5a2f; }
    .badge.pending   { background:#2e2008; color:var(--orange); border:1px solid #5a4010; }
    .badge.inactive  { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }

    /* SQL */
    .sql-copy-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .sql-copy-row span { font-size:9px; color:var(--text-muted); }
    #copy-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-muted); font-size:10px; padding:2px 8px; cursor:pointer; }
    #copy-btn:hover { color:var(--text); border-color:var(--accent); }
    #edit-query-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-muted); font-size:10px; padding:2px 8px; cursor:pointer; }
    #edit-query-btn:hover { color:var(--text); border-color:var(--accent); }
    #execute-query { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-muted); font-size:10px; padding:2px 8px; cursor:pointer; }
    #execute-query:hover { color:var(--text); border-color:var(--accent); }
    pre  { background:var(--bg); border:1px solid var(--border); border-radius:var(--r); padding:8px; overflow-x:auto; margin:0; }
    code { font-family:var(--mono); font-size:10px; color:var(--sql-text); line-height:1.6; white-space:pre; }

    /* Event log */
    #debug-log { font-family:var(--mono); font-size:10px; color:var(--text-muted); display:flex; flex-direction:column; gap:2px; max-height:130px; overflow-y:auto; }
    #debug-log::-webkit-scrollbar { width:2px; }
    #debug-log::-webkit-scrollbar-thumb { background:var(--border); }
    .log-entry { display:flex; gap:6px; }
    .log-ts  { color:var(--border); flex-shrink:0; }
    .log-in  { color:var(--accent); }
    .log-out { color:var(--green); }
    .log-err { color:var(--red); }
    .log-sys { color:var(--orange); }

    /* Replay divider */
    .replay-div { display:flex; align-items:center; gap:6px; padding:2px 0; }
    .replay-div span { font-size:9px; color:var(--text-muted); white-space:nowrap; }
    .replay-div::before,.replay-div::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Publish modal ──────────────────────────────────────────── */
    #publish-overlay {
      display:         none;
      position:        fixed;
      inset:           0;
      background:      rgba(0,0,0,.65);
      z-index:         200;
      align-items:     center;
      justify-content: center;
    }
    #publish-overlay.visible { display:flex; }
    #publish-modal {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: 8px;
      padding:       24px 28px;
      width:         380px;
      display:       flex;
      flex-direction: column;
      gap:           14px;
      box-shadow:    0 20px 60px rgba(0,0,0,.6);
    }
    #publish-modal h3 {
      font-size:      14px;
      font-weight:    700;
      color:          var(--text);
      margin:         0;
    }
    #publish-modal p {
      font-size:  11px;
      color:      var(--text-dim);
      margin:     0;
      line-height: 1.5;
    }
    .pub-field { display:flex; flex-direction:column; gap:5px; }
    .pub-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
    .pub-input {
      background:    var(--surface-2);
      border:        1px solid var(--border);
      border-radius: 5px;
      color:         var(--text);
      font-family:   var(--sans);
      font-size:     12px;
      padding:       7px 10px;
      outline:       none;
      transition:    border-color .15s;
    }
    .pub-input:focus { border-color:var(--accent); }
    .pub-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
    .pub-cancel {
      background:    transparent;
      border:        1px solid var(--border);
      border-radius: 5px;
      color:         var(--text-dim);
      font-size:     12px;
      padding:       6px 14px;
      cursor:        pointer;
      transition:    border-color .15s, color .15s;
    }
    .pub-cancel:hover { border-color:var(--border-hi); color:var(--text); }
    .pub-confirm {
      background:    #2388ff;
      border:        1px solid #3b9cff;
      border-radius: 5px;
      color:         #fff;
      font-size:     12px;
      font-weight:   700;
      padding:       6px 18px;
      cursor:        pointer;
      transition:    background .15s;
    }
    .pub-confirm:hover    { background:#3b9cff; }
    .pub-confirm:disabled { opacity:.4; cursor:default; }
    .pub-status {
      font-size:  11px;
      padding:    6px 10px;
      border-radius: 4px;
      display:    none;
    }
    .pub-status.success { background:#1a3a1f; color:var(--green); border:1px solid #2a5a2f; display:block; }
    .pub-status.error   { background:#3a1a1a; color:var(--red);   border:1px solid #5a2a2f; display:block; }
    /* Edit modal  */

    .modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 500;
  align-items: center;
  justify-content: center;
}

.modal-overlay.visible {
  display: flex;
}

.modal {
  width: 700px;
  max-width: 90vw;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 {
  font-size: 14px;
  margin: 0;
}

.modal-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
}

.modal-close:hover {
  color: var(--red);
}

.modal-textarea {
  width: 100%;
  min-height: 250px;
  resize: vertical;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 10px;
  outline: none;
}

.modal-textarea:focus {
  border-color: var(--accent);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.modal-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

<script>

let replayDone = false;
let widgetCounter = 0;
let _lastSqlQuery = null;   // most recent SQL from agent, passed to addToCanvas

// // ── Panel collapse ───────────────────────────────────────────────────
// document.getElementById('tog-chat').addEventListener('click', () => {
//   document.getElementById('chat-panel').classList.toggle('collapsed');
// });
document.getElementById('tog-inspector').addEventListener('click', () => {
  document.getElementById('inspector').classList.toggle('collapsed');
});

// ── Inspector accordion ──────────────────────────────────────────────
function toggleSection(id) {
  document.getElementById(id).classList.toggle('open');
}

// ── Logging ──────────────────────────────────────────────────────────
function logEvent(dir, text) {
  const log   = document.getElementById('debug-log');
  const now   = new Date().toLocaleTimeString('en-GB', { hour12:false });
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const ts  = document.createElement('span');
  ts.className   = 'log-ts';
  ts.textContent = now;
  const msg = document.createElement('span');
  msg.className   = 'log-' + dir;
  msg.textContent = text;
  entry.appendChild(ts);
  entry.appendChild(msg);
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


// ── Chart palette & defaults ─────────────────────────────────────────
const PAL = ['#58a6ff','#3fb950','#d29922','#f85149',
             '#bc8cff','#39d5ff','#ff7b72','#ffa657'];

const CDEFAULTS = {
  plugins: {
    legend:  { labels:{ color:'#768390', font:{ size:10 } } },
    tooltip: { backgroundColor:'#1c2330', titleColor:'#cdd9e5', bodyColor:'#768390',
               borderColor:'#272e38', borderWidth:1 }
  },
  scales: {
    x:{ ticks:{ color:'#768390', font:{ size:10 } }, grid:{ color:'#1c2330' } },
    y:{ ticks:{ color:'#768390', font:{ size:10 } }, grid:{ color:'#1c2330' } }
  }
};

// ── Column detection ─────────────────────────────────────────────────
function detectCols(rows) {
  if (!rows || !rows.length) return { labelKey:null, valueKeys:[] };
  const first = rows[0], keys = Object.keys(first);
  let labelKey = null;
  const valueKeys = [];
  for (const k of keys) {
    if (typeof first[k] === 'number' && isFinite(first[k])) valueKeys.push(k);
    else if (!labelKey) labelKey = k;
  }
  if (!labelKey && valueKeys.length) labelKey = '_idx';
  return { labelKey, valueKeys };
}
function getLabels(rows, lk) {
  return lk === '_idx' ? rows.map((_,i)=>String(i+1)) : rows.map(r=>String(r[lk]??''));
}
function fmtNum(n) {
  if (Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+'M';
  if (Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'K';
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

// ── Build chart config (shared) ──────────────────────────────────────
function buildChartCfg(type, rows, stacked) {
  const { labelKey, valueKeys } = detectCols(rows);
  if (!rows.length || !valueKeys.length) return null;
  const labels   = getLabels(rows, labelKey);
  const datasets = valueKeys.map((k,i) => ({
    label:           k.replace(/_/g,' '),
    data:            rows.map(r=>r[k]??0),
    backgroundColor: PAL[i%PAL.length]+'cc',
    borderColor:     PAL[i%PAL.length],
    borderWidth:     1,
    borderRadius:    2,
    tension:         0.3,
    fill:            type==='line' && valueKeys.length===1,
    pointRadius:     type==='line' && rows.length>40 ? 0 : 3,
  }));
  return {
    type,
    data: { labels, datasets },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      animation:           { duration:400 },
      plugins:             { ...CDEFAULTS.plugins, ...(stacked?{}:{}) },
      scales:              type==='doughnut' ? undefined : {
        x:{ ...CDEFAULTS.scales.x, stacked },
        y:{ ...CDEFAULTS.scales.y, stacked },
      }
    }
  };
}

function buildPieCfg(rows) {
  const { labelKey, valueKeys } = detectCols(rows);
  if (!rows.length || !valueKeys.length) return null;
  const labels = getLabels(rows, labelKey);
  const values = rows.map(r=>r[valueKeys[0]]??0);
  return {
    type: 'doughnut',
    data: { labels, datasets:[{ data:values,
      backgroundColor: labels.map((_,i)=>PAL[i%PAL.length]+'cc'),
      borderColor:     labels.map((_,i)=>PAL[i%PAL.length]),
      borderWidth:1 }] },
    options: { responsive:true, maintainAspectRatio:false,
               animation:{duration:400}, plugins:CDEFAULTS.plugins }
  };
}

// ── Canvas: drag & resize ────────────────────────────────────────────
let activeWidget = null;
let dragOffX = 0, dragOffY = 0;

document.addEventListener('mousemove', e => {
  if (!activeWidget) return;
  const ca  = document.getElementById('canvas-area');
  const box = ca.getBoundingClientRect();
  let x = e.clientX - box.left - dragOffX;
  let y = e.clientY - box.top  - dragOffY;
  x = Math.max(0, Math.min(x, box.width  - activeWidget.offsetWidth));
  y = Math.max(0, Math.min(y, box.height - activeWidget.offsetHeight));
  activeWidget.style.left = x + 'px';
  activeWidget.style.top  = y + 'px';
});
document.addEventListener('mouseup', () => {
  if (activeWidget) {
    activeWidget.classList.remove('active');
    activeWidget = null;
  }
});

function makeWidgetDraggable(el) {
  return
  const hdr = el.querySelector('.cw-header');
  hdr.addEventListener('mousedown', e => {
    e.preventDefault();
    activeWidget = el;
    el.classList.add('active');
    // bring to front
    el.style.zIndex = ++widgetCounter + 10;
    const rect = el.getBoundingClientRect();
    const ca   = document.getElementById('canvas-area').getBoundingClientRect();
    dragOffX = e.clientX - rect.left;
    dragOffY = e.clientY - rect.top;
  });
}

// chart instances keyed by widget id for cleanup
const chartInstances = {};

// Registry of widget metadata for publish — keyed by DOM id (e.g. 'cw-3')
// Each entry: { uid, widgetType, result, query, sqlQuery }
const widgetRegistry = {};

function addToCanvas(widgetType, result, query, sqlQuery) {
  const ca  = document.getElementById('canvas-area');
  const wt  = (widgetType||'CHART').toUpperCase();
  const id  = 'cw-' + (++widgetCounter);

  // hide empty state
  document.getElementById('canvas-empty').style.opacity = '0';

  // place offset from last widget
  const offsetX = 40 + ((widgetCounter - 1) % 5) * 20;
  const offsetY = 40 + ((widgetCounter - 1) % 5) * 20;

  const widget = document.createElement('div');
  widget.className = 'canvas-widget';
  widget.id = id;
  widget.style.left   = offsetX + 'px';
  widget.style.top    = offsetY + 'px';
  widget.style.width  = wt === 'KPI' ? '200px' : '380px';
  widget.style.height = wt === 'KPI' ? '140px' : '240px';

  // header
  const hdr = document.createElement('div');
  hdr.className = 'cw-header';
  hdr.innerHTML =
    `<span class="cw-type-badge">${wt}</span>` +
    `<span class="cw-title">${escHtml(query||wt)}</span>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'cw-close';
  closeBtn.textContent = '×';
  closeBtn.addEventListener('click', () => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
    delete widgetRegistry[id];
    widget.remove();
    // restore empty hint if no widgets remain
    if (!ca.querySelector('.canvas-widget')) {
      document.getElementById('canvas-empty').style.opacity = '1';
    }
  });
  hdr.appendChild(closeBtn);
  widget.appendChild(hdr);

  // body
  const body = document.createElement('div');
  body.className = 'cw-body';

  if (wt === 'KPI') {
    const { valueKeys } = detectCols(result);
    const pk  = valueKeys[0] || Object.keys(result[0])[0];
    const val = result[0]?.[pk];
    const extras = [];
    if (result.length > 1) {
      result.slice(0, 5).forEach(r => {
        const lk = Object.keys(r).find(k => typeof r[k] !== 'number') || pk;
        extras.push(`${r[lk]}: ${fmtNum(r[pk])}`);
      });
    }
    const kpiDiv = document.createElement('div');
    kpiDiv.className = 'kpi-canvas';
    kpiDiv.innerHTML =
      `<div class="kv">${typeof val==='number'?fmtNum(val):val}</div>` +
      `<div class="kl">${pk.replace(/_/g,' ')}</div>` +
      (extras.length ? `<div class="ks">${extras.join('  ·  ')}</div>` : '');
    body.appendChild(kpiDiv);
  } else {
    let cfg = null;
    if      (wt==='BARCHART')   cfg = buildChartCfg('bar',  result, false);
    else if (wt==='STACKEDBAR') cfg = buildChartCfg('bar',  result, true);
    else if (wt==='LINECHART')  cfg = buildChartCfg('line', result, false);
    else if (wt==='PIECHART')   cfg = buildPieCfg(result);
    else                        cfg = buildChartCfg('bar',  result, false);

    if (cfg) {
      cfg.options.animation = { duration: 600 };
      const canvas = document.createElement('canvas');
      body.appendChild(canvas);
      // defer chart creation so the element has dimensions
      requestAnimationFrame(() => {
        chartInstances[id] = new Chart(canvas, cfg);
      });
    }
  }

  widget.appendChild(body);
  ca.appendChild(widget);
  makeWidgetDraggable(widget);

  // Register widget metadata for publish
  widgetRegistry[id] = {
    uid:        id,   // reuse DOM id as stable uid within this session
    widgetType: wt,
    query:      query    || null,
    sqlQuery:   sqlQuery || null,
    result:     result   || [],
  };

  // Listen for resize (ResizeObserver) to notify Chart.js
  if (wt !== 'KPI') {
    const ro = new ResizeObserver(() => {
      if (chartInstances[id]) chartInstances[id].resize();
    });
    ro.observe(widget);
  }

  logEvent('out', `Widget placed on canvas: ${wt}`);
}

// ── State panel update ───────────────────────────────────────────────
function updateState(s) {
  if (!s) return;

  // completeness meter
  const pct  = s.completeness || 0;
  const fill = document.getElementById('prog-fill');
  const gate = document.getElementById('meter-gate');
  document.getElementById('meter-val').textContent = pct.toFixed(1);
  fill.style.width = (pct * 100).toFixed(0) + '%';
  if (pct >= 0.9) {
    fill.style.background = 'var(--green)';
    gate.textContent = '✓ confirmed'; gate.style.color = 'var(--green)';
  } else if (pct > 0.5) {
    fill.style.background = 'var(--orange)';
    gate.textContent = 'needs > 0.80'; gate.style.color = 'var(--orange)';
  } else {
    fill.style.background = 'var(--text-muted)';
    gate.textContent = ''; 
  }

  
  // SQL
  if (s.sql && !s.sql.startsWith('--') && !s.sql.startsWith('INSUFFICIENT')) {
    _lastSqlQuery = s.sql;  // capture for addToCanvas
    document.getElementById('sql-code').textContent = s.sql;
    const conf = s.sql_confidence != null ? `conf ${(s.sql_confidence*100).toFixed(0)}%` : 'ready';
    document.getElementById('sql-conf-label').textContent = conf;
    // auto-open SQL section
    document.getElementById('sec-sql').classList.add('open');
    if (s.sql_data_errors) {
      const errRow = document.getElementById('sql-err-row');
      errRow.textContent = '⚠ ' + s.sql_data_errors;
      errRow.style.display = 'block';
    }
    logEvent('out', 'SQL ready' + (s.sql_confidence ? ` (${(s.sql_confidence*100).toFixed(0)}% conf)` : ''));
    if (s.sql_data_errors) logEvent('err', s.sql_data_errors);
  }
}





// ── Copy SQL ──────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('sql-code').textContent).then(() => {
    this.textContent = 'Copied!';
    setTimeout(() => { this.textContent = 'Copy'; }, 1800);
  });
});

// -- TODO: Execute sql code --------------------

// ── Theme switcher ────────────────────────────────────────────────────
const themes = {
  dark: {
    '--bg':'#0b0f14','--canvas-bg':'#0d1117','--surface':'#161b22',
    '--surface-2':'#1c2330','--border':'#272e38','--text':'#cdd9e5',
    '--text-dim':'#768390','--text-muted':'#4d5768',
    '--accent':'#58a6ff','--accent-dim':'#1c3354',
  },
  light: {
    '--bg':'#f3f4f6','--canvas-bg':'#ffffff','--surface':'#ffffff',
    '--surface-2':'#f1f5f9','--border':'#d1d5db','--text':'#111827',
    '--text-dim':'#6b7280','--text-muted':'#9ca3af',
    '--accent':'#2563eb','--accent-dim':'#dbeafe',
  },
  blue: {
    '--bg':'#0f172a','--canvas-bg':'#172554','--surface':'#1e293b',
    '--surface-2':'#334155','--border':'#475569','--text':'#e2e8f0',
    '--text-dim':'#94a3b8','--text-muted':'#64748b',
    '--accent':'#3b82f6','--accent-dim':'#1c3354',
  },
  green: {
    '--bg':'#07140c','--canvas-bg':'#0c1f12','--surface':'#102516',
    '--surface-2':'#16321f','--border':'#245032','--text':'#d8ffe5',
    '--text-dim':'#8ab89a','--text-muted':'#4a7a5a',
    '--accent':'#3fb950','--accent-dim':'#1c3354',
  },
};

function applyTheme(name) {
  const t = themes[name] || themes.dark;
  Object.entries(t).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('ds-theme', name);
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === name);
  });
}

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
});

// Apply saved or default theme on load
applyTheme(localStorage.getItem('ds-theme') || 'dark');


// Collect live canvas geometry
function collectCanvasState() {
  const ca = document.getElementById('canvas-area');
  return Array.from(ca.querySelectorAll('.canvas-widget')).map((el, i) => ({
    uid:     el.id,
    x:       parseInt(el.style.left)   || 0,
    y:       parseInt(el.style.top)    || 0,
    width:   el.offsetWidth,
    height:  el.offsetHeight,
    z_index: parseInt(el.style.zIndex) || (i + 1),
  }));
}


// ── Dashboard restore ─────────────────────────────────────────────────
// When loaded with ?dashboard=<id>, fetch the saved dashboard from the
// API and rehydrate every widget onto the canvas at its stored position,
// size, and type — bypassing the agent entirely.

async function restoreDashboard(dashboardId) {
  try {
    logEvent('sys', `Loading dashboard ${dashboardId}…`);

    const res = await fetch(`/dashboards/${dashboardId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const dash = await res.json();   // {id, name, widgets:[WidgetRow…]}

    if (!dash.widgets || !dash.widgets.length) {
      logEvent('sys', 'Dashboard has no widgets.');
      return;
    }

    // Update topbar session tag to show dashboard name
    document.getElementById('room-display').textContent = dash.name || `Dashboard ${dashboardId}`;

    // Restore each widget in z_index order so stacking is correct
    const sorted = [...dash.widgets].sort((a, b) => (a.z_index || 1) - (b.z_index || 1));

    for (const w of sorted) {
      // result_json may be a parsed object already or a JSON string
      let result = w.result_json || [];
      if (typeof result === 'string') {
        try { result = JSON.parse(result); } catch { result = []; }
      }

      restoreWidget(w, result);
    }

    // Hide empty-state hint since we just placed widgets
    document.getElementById('canvas-empty').style.opacity = '0';
    logEvent('sys', `Restored ${sorted.length} widget(s) from "${dash.name}"`);

  } catch (err) {
    logEvent('err', 'Restore failed: ' + err.message);
  }
}

// Place a single saved widget onto the canvas using its stored geometry
function restoreWidget(w, result) {
  const ca  = document.getElementById('canvas-area');
  const wt  = (w.widget_type || 'BARCHART').toUpperCase();
  const id  = w.widget_uid || ('cw-restore-' + w.id);
  widgetCounter++;

  // Don't add duplicate if somehow already on canvas
  if (document.getElementById(id)) return;

  const widget = document.createElement('div');
  widget.className = 'canvas-widget';
  widget.id        = id;
  widget.style.left    = (w.x      || 40)  + 'px';
  widget.style.top     = (w.y      || 40)  + 'px';
  widget.style.width   = (w.width  || 380) + 'px';
  widget.style.height  = (w.height || 240) + 'px';
  widget.style.zIndex  = (w.z_index || widgetCounter) + 10;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'cw-header';
  hdr.innerHTML =
    `<span class="cw-type-badge">${escHtml(wt)}</span>` +
    `<span class="cw-title">${escHtml(w.title || w.query || wt)}</span>`;

  const closeBtn = document.createElement('button');
  closeBtn.className   = 'cw-close';
  closeBtn.textContent = '×';
  closeBtn.addEventListener('click', () => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
    delete widgetRegistry[id];
    widget.remove();
    if (!ca.querySelector('.canvas-widget')) {
      document.getElementById('canvas-empty').style.opacity = '1';
    }
  });
  hdr.appendChild(closeBtn);
  widget.appendChild(hdr);

  // Body
  const body = document.createElement('div');
  body.className = 'cw-body';

  if (wt === 'KPI') {
    const { valueKeys } = detectCols(result);
    const pk  = valueKeys[0] || (result[0] ? Object.keys(result[0])[0] : null);
    const val = pk && result[0] ? result[0][pk] : '—';
    const extras = [];
    if (result.length > 1) {
      result.slice(0, 5).forEach(r => {
        const lk = Object.keys(r).find(k => typeof r[k] !== 'number') || pk;
        if (pk) extras.push(`${r[lk]}: ${fmtNum(r[pk])}`);
      });
    }
    const kpiDiv = document.createElement('div');
    kpiDiv.className = 'kpi-canvas';
    kpiDiv.innerHTML =
      `<div class="kv">${typeof val === 'number' ? fmtNum(val) : val}</div>` +
      (pk ? `<div class="kl">${pk.replace(/_/g, ' ')}</div>` : '') +
      (extras.length ? `<div class="ks">${extras.join('  ·  ')}</div>` : '');
    body.appendChild(kpiDiv);
  } else if (result && result.length) {
    let cfg = null;
    if      (wt === 'BARCHART')   cfg = buildChartCfg('bar',  result, false);
    else if (wt === 'STACKEDBAR') cfg = buildChartCfg('bar',  result, true);
    else if (wt === 'LINECHART')  cfg = buildChartCfg('line', result, false);
    else if (wt === 'PIECHART')   cfg = buildPieCfg(result);
    else                          cfg = buildChartCfg('bar',  result, false);

    if (cfg) {
      cfg.options.animation = { duration: 500 };
      const canvas = document.createElement('canvas');
      body.appendChild(canvas);
      requestAnimationFrame(() => {
        chartInstances[id] = new Chart(canvas, cfg);
      });
    }
  } else {
    // No result data — show query text as placeholder
    const ph = document.createElement('div');
    ph.style.cssText = 'font-size:11px;color:var(--text-muted);text-align:center;padding:8px;';
    ph.textContent = w.query || 'No data';
    body.appendChild(ph);
  }

  widget.appendChild(body);
  ca.appendChild(widget);
  makeWidgetDraggable(widget);

  // Register in widgetRegistry so re-publish works correctly
  widgetRegistry[id] = {
    uid:        id,
    widgetType: wt,
    query:      w.query    || null,
    sqlQuery:   w.sql_query || null,
    result:     result,
  };
  console.log(widgetRegistry)
  // ResizeObserver for chart widgets
  if (wt !== 'KPI') {
    const ro = new ResizeObserver(() => {
      if (chartInstances[id]) chartInstances[id].resize();
    });
    ro.observe(widget);
  }
  // Populate the sql query on click
  widget.addEventListener('click', () => {

        const meta = widgetRegistry[id];
        document
        .querySelectorAll('.canvas-widget.selected')
        .forEach(w => w.classList.remove('selected'));
        widget.classList.add("selected");
        if (!meta) return;

        document.getElementById('sql-code').textContent =
            meta.sqlQuery || '-- No SQL available';

        document.getElementById('sql-conf-label').textContent =
            meta.widgetType || '';

        document.getElementById('sec-sql').classList.add('open');
        });
    }


// Approve reject handler
function updateStatus(status){
  const params = new URLSearchParams(window.location.search);
  const dashId = params.get('dashboard');
  if (dashId) {
    const selectedWidget = document.querySelector('.canvas-widget.selected');
    if (selectedWidget){
      
      const widget_uid = selectedWidget.id;
      fetch(`/dashboards/${dashId}/widgets/${widget_uid}`, {
        method:  'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          status: status
        }),
      });
      
    }
    

  }
}

const approveBtn = document.getElementById('approve-btn');
approveBtn.addEventListener('click', async () => updateStatus("APPROVED"));

const rejectBtn = document.getElementById('reject-btn');
approveBtn.addEventListener('click', updateStatus("REJECTED"));


// ── Boot: check for ?dashboard= param and restore if present ──────────
(function boot() {
  const params = new URLSearchParams(window.location.search);
  const dashId = params.get('dashboard');
  if (dashId) {
    restoreDashboard(Number(dashId));
  }
})();

// Edit query logic
const editBtn = document.getElementById('edit-query-btn');
const editOverlay = document.getElementById('edit-query-overlay');
const editTextarea = document.getElementById('edit-query-text');

function openEditQueryModal() {
  const selectedWidget =
    document.querySelector('.canvas-widget.selected');
  if (selectedWidget) {
      const meta = widgetRegistry[selectedWidget.id];
      document.getElementById('user-query-display').textContent =
          meta?.query.toUpperCase() || 'No query available';

      editTextarea.value =
          meta?.sqlQuery || '';
  } else {
      document.getElementById('user-query-display').textContent =
          'No widget selected';

      editTextarea.value =
          document.getElementById('sql-code').textContent || '';
  }

  editOverlay.classList.add('visible');
  editTextarea.focus();
}

function closeEditQueryModal() {
  editOverlay.classList.remove('visible');
}

editBtn.addEventListener('click', openEditQueryModal);

document
  .getElementById('edit-query-close')
  .addEventListener('click', closeEditQueryModal);

document
  .getElementById('edit-query-cancel')
  .addEventListener('click', closeEditQueryModal);

editOverlay.addEventListener('click', (e) => {
  if (e.target === editOverlay) {
    closeEditQueryModal();
  }
});

document
  .getElementById('edit-query-save')
  .addEventListener('click', () => {

    const updatedQuery = editTextarea.value.trim();

    // update displayed SQL/query
    document.getElementById('sql-code').textContent = updatedQuery;

    // update state variable if used elsewhere
    _lastSqlQuery = updatedQuery;

    closeEditQueryModal();
  });
</script>
