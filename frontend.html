<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Studio — Agent Test Console</title>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #21262d;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #7d8590;
      --accent:      #58a6ff;
      --accent-dim:  #1f3a5f;
      --user-bubble: #1c2b3a;
      --agent-bubble:#1a2332;
      --green:       #3fb950;
      --orange:      #d29922;
      --red:         #f85149;
      --sql-bg:      #0d1117;
      --sql-text:    #79c0ff;
      --mono:        'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sans:        -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius:      6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: 48px 1fr;
      overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────────────────────────── */
    #topbar {
      grid-column: 1 / -1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    #topbar .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .04em;
    }
    #topbar .sep { color: var(--border); }
    #topbar .session-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    #conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-left: auto;
      transition: background .3s;
      flex-shrink: 0;
    }
    #conn-dot.live  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
    #conn-dot.error { background: var(--red); }
    #conn-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Left panel: chat ────────────────────────────────────────────── */
    #chat-panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-panel header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    /* Scrollbar */
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .bubble {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.agent {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      align-self: flex-start;
      color: var(--text);
    }
    .bubble.user {
      background: var(--accent-dim);
      border: 1px solid #2a4a7a;
      align-self: flex-end;
      color: var(--text);
    }
    .bubble.system {
      background: transparent;
      border: none;
      align-self: center;
      color: var(--text-muted);
      font-size: 11px;
      font-style: italic;
    }
    .bubble .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .bubble.agent .label { color: var(--accent); }
    .bubble.user  .label { color: #a0c4ff; }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color .2s;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input:disabled { opacity: .45; }

    #send-btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      cursor: pointer;
      transition: opacity .15s;
    }
    #send-btn:hover:not(:disabled) { opacity: .85; }
    #send-btn:disabled { opacity: .35; cursor: default; }

    /* ── Right panel: state inspector ───────────────────────────────── */
    #state-panel {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #state-panel::-webkit-scrollbar { width: 4px; }
    #state-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .card-body {
      padding: 12px;
    }

    /* Completeness meter */
    .meter-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .meter-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      transition: color .3s;
    }
    .meter-label {
      font-size: 11px;
      color: var(--text-muted);
    }
    .meter-gate {
      font-size: 11px;
      font-weight: 600;
    }
    .progress-track {
      background: var(--surface-2);
      border-radius: 3px;
      height: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      width: 0%;
      background: var(--text-muted);
      transition: width .45s cubic-bezier(.4,0,.2,1), background .3s;
    }
    .step-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
    .step-labels span {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--border);
    }

    /* Slot rows */
    .slot-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .slot-row:last-child { border-bottom: none; padding-bottom: 0; }
    .slot-key {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .slot-value {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
    }
    .slot-value.empty  { color: var(--text-muted); font-style: italic; }
    .slot-value.filled { color: var(--green); }
    .slot-value.waiting { color: var(--orange); }

    /* Badge */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge.confirmed { background: #1a3a1f; color: var(--green); border: 1px solid #2a5a2f; }
    .badge.pending   { background: #2e2008; color: var(--orange); border: 1px solid #5a4010; }
    .badge.inactive  { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

    /* SQL block */
    #sql-output-area { display: none; }
    .sql-copy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .sql-copy-row span { font-size: 11px; color: var(--text-muted); }
    #copy-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    #copy-btn:hover { color: var(--text); border-color: var(--accent); }
    pre {
      background: var(--sql-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      overflow-x: auto;
      margin: 0;
    }
    code {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--sql-text);
      line-height: 1.6;
      white-space: pre;
    }

    /* ── Debug log ───────────────────────────────────────────────────── */
    #debug-log {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 140px;
      overflow-y: auto;
    }
    #debug-log::-webkit-scrollbar { width: 3px; }
    #debug-log::-webkit-scrollbar-thumb { background: var(--border); }
    .log-entry { display: flex; gap: 8px; }
    .log-ts   { color: var(--border); flex-shrink: 0; }
    .log-in   { color: #58a6ff; }
    .log-out  { color: #3fb950; }
    .log-err  { color: var(--red); }
    .log-sys  { color: var(--orange); }

    /* ── History replay banner ───────────────────────────────────────── */
    .replay-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }
    .replay-divider span {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .replay-divider::before,
    .replay-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <span class="logo">◈ Dashboard Studio</span>
  <span class="sep">|</span>
  <span class="session-id" id="room-display">connecting…</span>
  <span id="conn-label">disconnected</span>
  <div id="conn-dot"></div>
</div>

<!-- Left: chat -->
<div id="chat-panel">
  <header>Conversation</header>
  <div id="chat-box"></div>
  <div id="input-row">
    <input id="user-input" type="text" placeholder="Tell me what you want to visualise…"
           autocomplete="off" disabled />
    <button id="send-btn" disabled>Send</button>
  </div>
</div>

<!-- Right: state inspector -->
<div id="state-panel">

  <!-- Completeness meter -->
  <div class="card">
    <div class="card-header">Completeness</div>
    <div class="card-body">
      <div class="meter-row">
        <span class="meter-value" id="meter-val">0.0</span>
        <span class="meter-gate" id="meter-gate"></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="completeness-bar"></div>
      </div>
      <div class="step-labels">
        <span>0.0</span><span>0.3</span><span>0.5</span>
        <span>0.7</span><span>0.9</span><span>1.0</span>
      </div>
    </div>
  </div>

  <!-- Slot inspector -->
  <div class="card">
    <div class="card-header">Collected Slots</div>
    <div class="card-body">

      <div class="slot-row">
        <div class="slot-key">Widget Type</div>
        <div class="slot-value empty" id="slot-widget">—</div>
      </div>

      <div class="slot-row">
        <div class="slot-key">Query Description</div>
        <div class="slot-value empty" id="slot-query">—</div>
      </div>

      <div class="slot-row" style="flex-direction:row;justify-content:space-between;align-items:center;">
        <div class="slot-key">Confirmed</div>
        <span class="badge inactive" id="slot-confirmed">Pending</span>
      </div>

    </div>
  </div>

  <!-- Generated SQL -->
  <div class="card" id="sql-output-area">
    <div class="card-header">Generated SQL</div>
    <div class="card-body">
      <div class="sql-copy-row">
        <span>Ready to execute</span>
        <button id="copy-btn">Copy</button>
      </div>
      <pre><code id="sql-code"></code></pre>
    </div>
  </div>

  <!-- Debug event log -->
  <div class="card">
    <div class="card-header">Event Log</div>
    <div class="card-body" style="padding:8px 10px;">
      <div id="debug-log"></div>
    </div>
  </div>

</div><!-- /state-panel -->

<script>
  // ── Session setup ─────────────────────────────────────────────────
  // Use a stable session ID stored in sessionStorage so page refreshes
  // within the same tab reconnect to the same chat history.
  let chatId = sessionStorage.getItem('dashboardChatId');
  if (!chatId) {
    chatId = 'session_' + Math.random().toString(36).substring(2, 9);
    sessionStorage.setItem('dashboardChatId', chatId);
  }
  document.getElementById('room-display').textContent = chatId;

  const ws       = new WebSocket('ws://' + window.location.host + '/ws/chat/' + chatId);
  const chatBox  = document.getElementById('chat-box');
  const input    = document.getElementById('user-input');
  const sendBtn  = document.getElementById('send-btn');
  const dot      = document.getElementById('conn-dot');
  const connLbl  = document.getElementById('conn-label');

  // Track whether we're still receiving replayed history
  let replayDone = false;

  // ── Logging ───────────────────────────────────────────────────────
  function logEvent(dir, text) {
    const log   = document.getElementById('debug-log');
    const now   = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML =
      `<span class="log-ts">${now}</span>` +
      `<span class="log-${dir}">${escapeHtml(text)}</span>`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Chat bubbles ──────────────────────────────────────────────────
  function addBubble(type, text, dimmed) {
    // type: 'agent' | 'user' | 'system'
    const wrap = document.createElement('div');
    wrap.className = 'bubble ' + type;
    if (dimmed) wrap.style.opacity = '0.6';

    if (type !== 'system') {
      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.textContent = type === 'agent' ? 'Agent' : 'You';
      wrap.appendChild(lbl);
    }

    const txt = document.createElement('div');
    txt.textContent = text;   // textContent — no XSS
    wrap.appendChild(txt);
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addReplayDivider() {
    const d = document.createElement('div');
    d.className = 'replay-divider';
    d.innerHTML = '<span>↑ previous session ↑</span>';
    chatBox.appendChild(d);
  }

  // ── State panel updates ───────────────────────────────────────────
  function updateState(s) {
    // null = replayed history turn, no state to update
    if (!s) return;

    // Completeness meter
    const pct = s.completeness || 0;
    document.getElementById('meter-val').textContent = pct.toFixed(1);
    const bar  = document.getElementById('completeness-bar');
    const gate = document.getElementById('meter-gate');
    bar.style.width = (pct * 100).toFixed(0) + '%';
    if (pct >= 0.9) {
      bar.style.background = 'var(--green)';
      gate.textContent     = '✓ confirmed';
      gate.style.color     = 'var(--green)';
    } else if (pct > 0.8) {
      bar.style.background = 'var(--green)';
      gate.textContent     = '✓ threshold met';
      gate.style.color     = 'var(--green)';
    } else if (pct > 0.5) {
      bar.style.background = 'var(--orange)';
      gate.textContent     = 'needs > 0.80';
      gate.style.color     = 'var(--orange)';
    } else {
      bar.style.background = 'var(--text-muted)';
      gate.textContent     = 'needs > 0.80';
      gate.style.color     = 'var(--text-muted)';
    }

    // Widget slot
    const wEl = document.getElementById('slot-widget');
    if (s.widget) {
      wEl.textContent = s.widget;
      wEl.className   = 'slot-value filled';
    } else {
      wEl.textContent = '—';
      wEl.className   = 'slot-value empty';
    }

    // Query slot
    const qEl = document.getElementById('slot-query');
    if (s.query) {
      qEl.textContent = s.query;
      qEl.className   = 'slot-value filled';
    } else {
      qEl.textContent = '—';
      qEl.className   = 'slot-value empty';
    }

    // Confirmed badge
    const cEl = document.getElementById('slot-confirmed');
    if (s.confirmed) {
      cEl.textContent = 'Confirmed';
      cEl.className   = 'badge confirmed';
    } else if (s.widget || s.query) {
      cEl.textContent = 'Waiting';
      cEl.className   = 'badge pending';
    } else {
      cEl.textContent = 'Pending';
      cEl.className   = 'badge inactive';
    }

    // SQL output
    if (s.sql) {
      document.getElementById('sql-code').textContent = s.sql;
      document.getElementById('sql-output-area').style.display = 'block';
      logEvent('out', 'SQL generated (' + s.sql.length + ' chars)');
    }
  }

  // ── WebSocket events ──────────────────────────────────────────────
  ws.onopen = function () {
    dot.className   = 'live';
    connLbl.textContent = 'connected';
    logEvent('sys', 'WebSocket open → ' + chatId);
  };

  ws.onmessage = function (event) {
    const data   = JSON.parse(event.data);
    const sender = data.sender;   // 'agent' | 'user'
    const isReplay = data.system_status === null;

    if (isReplay && !replayDone) {
      // Replayed history arrives before live turns.
      // Show dimmed bubbles so the user knows it's prior context.
      addBubble(sender, data.message, true);
      logEvent('in', '[replay] ' + sender + ': ' + data.message.slice(0, 60));
      return;
    }

    // First live message after replay — insert divider once
    if (!replayDone && !isReplay) {
      if (chatBox.children.length > 0) addReplayDivider();
      replayDone = true;
      // Enable input now that live session is confirmed ready
      input.disabled  = false;
      sendBtn.disabled = false;
      input.focus();
    }

    addBubble(sender === 'user' ? 'user' : 'agent', data.message, false);
    updateState(data.system_status);
    logEvent('in', sender + ': ' + data.message.slice(0, 80));
  };

  ws.onerror = function () {
    dot.className   = 'error';
    connLbl.textContent = 'error';
    addBubble('system', 'Connection error — please refresh.');
    logEvent('err', 'WebSocket error');
  };

  ws.onclose = function () {
    dot.className    = '';
    connLbl.textContent = 'disconnected';
    addBubble('system', 'Session ended.');
    sendBtn.disabled  = true;
    input.disabled   = true;
    logEvent('sys', 'WebSocket closed');
  };

  // ── New sessions: enable input immediately (no replay)
  // If this is a brand-new chat, the server sends the greeting immediately
  // and no replay messages arrive, so we flip replayDone on first onmessage.
  // The flag is set when we see the first non-null system_status.

  // ── Send ──────────────────────────────────────────────────────────
  function sendMessage() {
    const text = input.value.trim();
    if (!text || ws.readyState !== WebSocket.OPEN) return;
    ws.send(text);
    addBubble('user', text, false);
    logEvent('out', 'user: ' + text.slice(0, 80));
    input.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendMessage();
  });

  // ── Copy SQL ──────────────────────────────────────────────────────
  document.getElementById('copy-btn').addEventListener('click', function () {
    const sql = document.getElementById('sql-code').textContent;
    navigator.clipboard.writeText(sql).then(() => {
      this.textContent = 'Copied!';
      setTimeout(() => { this.textContent = 'Copy'; }, 1800);
    });
  });
</script>
</body>
</html>
