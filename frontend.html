<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ── Design tokens ───────────────────────────────────────────── */
    :root {
      --bg:         #0b0f14;
      --canvas-bg:  #0d1117;
      --surface:    #161b22;
      --surface-2:  #1c2330;
      --border:     #272e38;
      --border-hi:  #3a4453;
      --text:       #cdd9e5;
      --text-dim:   #768390;
      --text-muted: #4d5768;
      --accent:     #58a6ff;
      --accent-dim: #1c3354;
      --green:      #3fb950;
      --orange:     #d29922;
      --red:        #f85149;
      --sql-text:   #79c0ff;
      --mono:       'JetBrains Mono','Fira Code',monospace;
      --sans:       -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --r:          5px;
      --panel-w:    300px;
      --topbar-h:   44px;

      /* chart palette */
      --c0:#58a6ff;--c1:#3fb950;--c2:#d29922;--c3:#f85149;
      --c4:#bc8cff;--c5:#39d5ff;--c6:#ff7b72;--c7:#ffa657;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body {
      font-family: var(--sans);
      background:  var(--canvas-bg);
      color:       var(--text);
      height:      100dvh;
      display:     flex;
      flex-direction: column;
      overflow:    hidden;
    }

    /* ── Topbar ─────────────────────────────────────────────────── */
    #topbar {
      height:      var(--topbar-h);
      flex-shrink: 0;
      background:  var(--surface);
      border-bottom: 1px solid var(--border);
      display:     flex;
      align-items: center;
      padding:     0 14px;
      gap:         10px;
      z-index:     100;
    }
    .logo {
      font-family:    var(--mono);
      font-size:      12px;
      font-weight:    700;
      color:          var(--accent);
      letter-spacing: .06em;
    }
    .top-sep { width:1px; height:16px; background:var(--border); }
    .session-tag {
      font-family: var(--mono);
      font-size:   10px;
      color:       var(--text-muted);
    }
    #conn-wrap { margin-left:auto; display:flex; align-items:center; gap:6px; }
    #conn-dot  { width:7px; height:7px; border-radius:50%; background:var(--text-muted); transition:background .3s; }
    #conn-dot.live  { background:var(--green); box-shadow:0 0 5px var(--green); }
    #conn-dot.error { background:var(--red); }
    #conn-label { font-size:10px; color:var(--text-muted); }

    /* collapse toggle buttons in topbar */
    .tog-btn {
      background:  transparent;
      border:      1px solid var(--border);
      border-radius: var(--r);
      color:       var(--text-dim);
      font-size:   11px;
      padding:     3px 9px;
      cursor:      pointer;
      display:     flex;
      align-items: center;
      gap:         5px;
      transition:  border-color .15s, color .15s;
      white-space: nowrap;
    }
    .tog-btn:hover { border-color:var(--accent); color:var(--accent); }
    .tog-btn svg   { flex-shrink:0; }
    /* -- Publish btn ---------------------------------------------- */
    .publish-btn {
      background: #2388ff;
      color: #ffffff;
      border: 1px solid #3b9cff;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 6px;

      transition: all 0.15s ease;
      box-shadow: 0 0 12px rgba(35,136,255,0.25);
    }

    .publish-btn:hover {
      background: #3b9cff;
      border-color: #58a6ff;
      box-shadow: 0 0 18px rgba(88,166,255,0.4);
    }

    .publish-btn:active {
      transform: translateY(1px);
    }

    .publish-btn svg {
      flex-shrink: 0;
    }
    /* ── Main area ──────────────────────────────────────────────── */
    #main {
      flex:    1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ── Chat panel (left, collapsible) ─────────────────────────── */
    #chat-panel {
      width:      var(--panel-w);
      min-width:  var(--panel-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      transition: width .25s ease, min-width .25s ease, opacity .2s;
      z-index:    10;
    }
    #chat-panel.collapsed {
      width:     0;
      min-width: 0;
      opacity:   0;
      pointer-events: none;
    }

    .panel-header {
      flex-shrink: 0;
      padding:     9px 12px;
      font-size:   10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color:       var(--text-muted);
      border-bottom: 1px solid var(--border);
      display:     flex;
      align-items: center;
      justify-content: space-between;
    }

    #chat-box {
      flex:       1;
      overflow-y: auto;
      padding:    12px;
      display:    flex;
      flex-direction: column;
      gap:        8px;
      scroll-behavior: smooth;
    }
    #chat-box::-webkit-scrollbar { width:3px; }
    #chat-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .bubble {
      max-width:    92%;
      padding:      7px 11px;
      border-radius: var(--r);
      font-size:    12px;
      line-height:  1.6;
      word-break:   break-word;
    }
    .bubble.agent  { background:var(--surface-2); border:1px solid var(--border); align-self:flex-start; }
    .bubble.user   { background:var(--accent-dim); border:1px solid #2a4a7a; align-self:flex-end; }
    .bubble.system { align-self:center; color:var(--text-muted); font-size:10px; font-style:italic; background:transparent; border:none; }
    .bubble .blbl  { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
    .bubble.agent .blbl { color:var(--accent); }
    .bubble.user  .blbl { color:#8bc4ff; }

    /* Inline chart preview inside chat */
    .chat-chart-wrap {
      margin-top:    6px;
      background:    var(--bg);
      border:        1px solid var(--border);
      border-radius: var(--r);
      padding:       10px;
      position:      relative;
    }
    .chat-chart-wrap canvas { max-height:140px; }
    .chat-kpi-inline { text-align:center; padding:8px 0; }
    .chat-kpi-inline .kv { font-family:var(--mono); font-size:28px; font-weight:700; color:var(--accent); }
    .chat-kpi-inline .kl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
    .add-to-canvas-btn {
      position: absolute; top:6px; right:6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-dim);
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .add-to-canvas-btn:hover { border-color:var(--accent); color:var(--accent); }

    #input-row {
      flex-shrink: 0;
      display:     flex;
      gap:         6px;
      padding:     8px 10px;
      border-top:  1px solid var(--border);
    }
    #user-input {
      flex:        1;
      background:  var(--surface-2);
      border:      1px solid var(--border);
      border-radius: var(--r);
      color:       var(--text);
      font-family: var(--sans);
      font-size:   12px;
      padding:     6px 9px;
      outline:     none;
      transition:  border-color .15s;
    }
    #user-input:focus    { border-color:var(--accent); }
    #user-input:disabled { opacity:.4; }
    #send-btn {
      background:  var(--accent);
      color:       #0b0f14;
      border:      none;
      border-radius: var(--r);
      font-size:   12px;
      font-weight: 700;
      padding:     6px 14px;
      cursor:      pointer;
      transition:  opacity .15s;
    }
    #send-btn:hover:not(:disabled) { opacity:.85; }
    #send-btn:disabled { opacity:.3; cursor:default; }

    /* ── Canvas (middle) ────────────────────────────────────────── */
    #canvas-area {
      flex:     1;
      position: relative;
      overflow: hidden;
      /* signature element: dot grid */
      background-color:   var(--canvas-bg);
      background-image:   radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size:    24px 24px;
    }

    #canvas-empty {
      position:   absolute;
      inset:      0;
      display:    flex;
      flex-direction: column;
      align-items:    center;
      justify-content: center;
      gap:        8px;
      pointer-events: none;
      transition: opacity .3s;
    }
    #canvas-empty .empty-icon { font-size:28px; opacity:.15; }
    #canvas-empty p { font-size:12px; color:var(--text-muted); opacity:.5; }

    /* Draggable widget cards on canvas */
    .canvas-widget {
      position:   absolute;
      background: var(--surface);
      border:     1px solid var(--border);
      border-radius: var(--r);
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      min-width:  200px;
      min-height: 140px;
      /* resize handle built-in */
      resize:     both;
    }
    .canvas-widget:hover { border-color:var(--border-hi); }
    .canvas-widget.active { border-color:var(--accent); z-index:50; }

    .cw-header {
      flex-shrink:  0;
      padding:      6px 10px;
      background:   var(--surface-2);
      border-bottom:1px solid var(--border);
      display:      flex;
      align-items:  center;
      gap:          6px;
      cursor:       grab;
      user-select:  none;
    }
    .cw-header:active { cursor:grabbing; }
    .cw-type-badge {
      font-family:    var(--mono);
      font-size:      9px;
      font-weight:    700;
      letter-spacing: .08em;
      color:          var(--accent);
      background:     var(--accent-dim);
      padding:        1px 6px;
      border-radius:  3px;
    }
    .cw-title {
      font-size:     11px;
      color:         var(--text-dim);
      flex:          1;
      overflow:      hidden;
      text-overflow: ellipsis;
      white-space:   nowrap;
    }
    .cw-close {
      background:  transparent;
      border:      none;
      color:       var(--text-muted);
      font-size:   13px;
      cursor:      pointer;
      padding:     0 2px;
      line-height: 1;
      transition:  color .1s;
    }
    .cw-close:hover { color:var(--red); }

    .cw-body {
      flex:       1;
      padding:    10px;
      overflow:   hidden;
      display:    flex;
      align-items: center;
      justify-content: center;
    }
    .cw-body canvas { width:100% !important; height:100% !important; }

    /* KPI on canvas */
    .kpi-canvas {
      display:        flex;
      flex-direction: column;
      align-items:    center;
      justify-content: center;
      gap:            4px;
      width:          100%;
    }
    .kpi-canvas .kv { font-family:var(--mono); font-size:36px; font-weight:700; color:var(--accent); line-height:1; }
    .kpi-canvas .kl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; }
    .kpi-canvas .ks { font-size:10px; color:var(--text-muted); font-family:var(--mono); margin-top:4px; }

    /* ── Right inspector panel ──────────────────────────────────── */
    #inspector {
      width:      var(--panel-w);
      min-width:  var(--panel-w);
      background: var(--surface);
      border-left:1px solid var(--border);
      display:    flex;
      flex-direction: column;
      overflow:   hidden;
      transition: width .25s ease, min-width .25s ease, opacity .2s;
      z-index:    10;
    }
    #inspector.collapsed {
      width:     0;
      min-width: 0;
      opacity:   0;
      pointer-events: none;
    }
    #inspector-scroll {
      flex:       1;
      overflow-y: auto;
      padding:    10px;
      display:    flex;
      flex-direction: column;
      gap:        10px;
    }
    #inspector-scroll::-webkit-scrollbar { width:3px; }
    #inspector-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    /* Inspector accordion sections */
    .insp-section { border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
    .insp-section-hdr {
      padding:        7px 10px;
      font-size:      9px;
      font-weight:    700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color:          var(--text-muted);
      background:     var(--surface-2);
      display:        flex;
      justify-content: space-between;
      align-items:    center;
      cursor:         pointer;
      user-select:    none;
      transition:     color .15s;
    }
    .insp-section-hdr:hover { color:var(--text); }
    .insp-section-hdr .chevron { transition:transform .2s; font-size:10px; }
    .insp-section.open .chevron { transform:rotate(180deg); }
    .insp-section-body { display:none; padding:10px; }
    .insp-section.open .insp-section-body { display:block; }

    /* Completeness meter */
    .meter-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
    .meter-val  { font-family:var(--mono); font-size:20px; font-weight:700; }
    .meter-gate { font-size:10px; font-weight:600; }
    .prog-track { background:var(--surface-2); border-radius:2px; height:5px; overflow:hidden; }
    .prog-fill  { height:100%; border-radius:2px; width:0%; background:var(--text-muted); transition:width .4s cubic-bezier(.4,0,.2,1),background .3s; }
    .step-labels { display:flex; justify-content:space-between; margin-top:3px; }
    .step-labels span { font-family:var(--mono); font-size:8px; color:var(--border); }

    /* Slots */
    .slot-row { padding:6px 0; border-bottom:1px solid var(--border); }
    .slot-row:last-child { border-bottom:none; }
    .slot-key { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px; }
    .slot-val  { font-family:var(--mono); font-size:11px; word-break:break-word; }
    .slot-val.empty  { color:var(--text-muted); font-style:italic; }
    .slot-val.filled { color:var(--green); }
    .badge { display:inline-block; font-size:9px; font-weight:700; letter-spacing:.05em; padding:2px 7px; border-radius:20px; text-transform:uppercase; }
    .badge.confirmed { background:#1a3a1f; color:var(--green); border:1px solid #2a5a2f; }
    .badge.pending   { background:#2e2008; color:var(--orange); border:1px solid #5a4010; }
    .badge.inactive  { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }

    /* SQL */
    .sql-copy-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .sql-copy-row span { font-size:9px; color:var(--text-muted); }
    #copy-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-muted); font-size:10px; padding:2px 8px; cursor:pointer; }
    #copy-btn:hover { color:var(--text); border-color:var(--accent); }
    pre  { background:var(--bg); border:1px solid var(--border); border-radius:var(--r); padding:8px; overflow-x:auto; margin:0; }
    code { font-family:var(--mono); font-size:10px; color:var(--sql-text); line-height:1.6; white-space:pre; }

    /* Event log */
    #debug-log { font-family:var(--mono); font-size:10px; color:var(--text-muted); display:flex; flex-direction:column; gap:2px; max-height:130px; overflow-y:auto; }
    #debug-log::-webkit-scrollbar { width:2px; }
    #debug-log::-webkit-scrollbar-thumb { background:var(--border); }
    .log-entry { display:flex; gap:6px; }
    .log-ts  { color:var(--border); flex-shrink:0; }
    .log-in  { color:var(--accent); }
    .log-out { color:var(--green); }
    .log-err { color:var(--red); }
    .log-sys { color:var(--orange); }

    /* Replay divider */
    .replay-div { display:flex; align-items:center; gap:6px; padding:2px 0; }
    .replay-div span { font-size:9px; color:var(--text-muted); white-space:nowrap; }
    .replay-div::before,.replay-div::after { content:''; flex:1; height:1px; background:var(--border); }

    /* theme */
    .theme-switcher {
  display: flex;
  align-items: center;
  gap: 4px;

  padding: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.theme-btn {
  width: 28px;
  height: 28px;

  border: none;
  border-radius: 4px;

  background: transparent;
  color: var(--text-dim);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: all 0.15s ease;
}

.theme-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}

.theme-btn.active {
  background: var(--accent);
  color: white;
}
  </style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <span class="logo">◈ Dashboard Studio</span>
  <div class="top-sep"></div>
  <span class="session-tag" id="room-display">connecting…</span>
  <div class="theme-switcher">
    <button class="theme-btn active" data-theme="dark">🌙</button>
    <button class="theme-btn" data-theme="light">☀️</button>
    <button class="theme-btn" data-theme="blue">🔵</button>
    <button class="theme-btn" data-theme="green">🟢</button>
  </div>
  <button class="tog-btn" id="tog-chat" title="Toggle chat">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <rect x="1" y="1" width="4" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
      <path d="M7 4h4M7 6h3M7 8h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    Chat
  </button>

  <button class="tog-btn" id="tog-inspector" title="Toggle inspector">
    Inspector
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <rect x="7" y="1" width="4" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
      <path d="M5 4H1M5 6H2M5 8H1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="publish-btn" id="publish-btn" title="Publish Dashboard">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
    Publish
  </button>

  <div id="conn-wrap">
    <span id="conn-label">disconnected</span>
    <div id="conn-dot"></div>
  </div>
</div>

<!-- Main -->
<div id="main">

  <!-- Left: chat -->
  <div id="chat-panel">
    <div class="panel-header">
      <span>Conversation</span>
    </div>
    <div id="chat-box"></div>
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Describe what to visualise…" autocomplete="off" disabled/>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <!-- Middle: canvas -->
  <div id="canvas-area">
    <div id="canvas-empty">
      <div class="empty-icon">⬡</div>
      <p>Confirm a widget to place charts here</p>
      <p style="font-size:10px">Drag · Resize · Arrange</p>
    </div>
  </div>

  <!-- Right: inspector -->
  <div id="inspector">
    <div class="panel-header"><span>Inspector</span></div>
    <div id="inspector-scroll">

      <!-- Completeness -->
      <div class="insp-section open" id="sec-completeness">
        <div class="insp-section-hdr" onclick="toggleSection('sec-completeness')">
          <span>Completeness</span><span class="chevron">▾</span>
        </div>
        <div class="insp-section-body">
          <div class="meter-row">
            <span class="meter-val" id="meter-val">0.0</span>
            <span class="meter-gate" id="meter-gate"></span>
          </div>
          <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
          <div class="step-labels">
            <span>0.0</span><span>0.3</span><span>0.5</span>
            <span>0.7</span><span>0.9</span><span>1.0</span>
          </div>
        </div>
      </div>

      <!-- Collected slots -->
      <div class="insp-section open" id="sec-slots">
        <div class="insp-section-hdr" onclick="toggleSection('sec-slots')">
          <span>Collected Slots</span><span class="chevron">▾</span>
        </div>
        <div class="insp-section-body">
          <div class="slot-row">
            <div class="slot-key">Widget Type</div>
            <div class="slot-val empty" id="slot-widget">—</div>
          </div>
          <div class="slot-row">
            <div class="slot-key">Query</div>
            <div class="slot-val empty" id="slot-query">—</div>
          </div>
          <div class="slot-row" style="display:flex;justify-content:space-between;align-items:center;flex-direction:row;">
            <div class="slot-key">Confirmed</div>
            <span class="badge inactive" id="slot-confirmed">Pending</span>
          </div>
        </div>
      </div>

      <!-- SQL -->
      <div class="insp-section" id="sec-sql">
        <div class="insp-section-hdr" onclick="toggleSection('sec-sql')">
          <span>Generated SQL</span><span class="chevron">▾</span>
        </div>
        <div class="insp-section-body">
          <div class="sql-copy-row">
            <span id="sql-conf-label">—</span>
            <button id="copy-btn">Copy</button>
          </div>
          <pre><code id="sql-code"></code></pre>
          <div id="sql-err-row" style="margin-top:6px;font-size:10px;color:var(--orange);display:none;"></div>
        </div>
      </div>

      <!-- Event log -->
      <div class="insp-section open" id="sec-log">
        <div class="insp-section-hdr" onclick="toggleSection('sec-log')">
          <span>Event Log</span><span class="chevron">▾</span>
        </div>
        <div class="insp-section-body" style="padding:6px 8px;">
          <div id="debug-log"></div>
        </div>
      </div>

    </div>
  </div>

</div><!-- /main -->

<script>
// ── Session ──────────────────────────────────────────────────────────
let chatId = sessionStorage.getItem('dashboardChatId');
if (!chatId) {
  chatId = 'session_' + Math.random().toString(36).substring(2, 9);
  sessionStorage.setItem('dashboardChatId', chatId);
}
document.getElementById('room-display').textContent = chatId;

const ws      = new WebSocket('ws://' + window.location.host + '/ws/chat/' + chatId);
const chatBox = document.getElementById('chat-box');
const input   = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

let replayDone = false;
let widgetCounter = 0;

// ── Panel collapse ───────────────────────────────────────────────────
document.getElementById('tog-chat').addEventListener('click', () => {
  document.getElementById('chat-panel').classList.toggle('collapsed');
});
document.getElementById('tog-inspector').addEventListener('click', () => {
  document.getElementById('inspector').classList.toggle('collapsed');
});

// ── Inspector accordion ──────────────────────────────────────────────
function toggleSection(id) {
  document.getElementById(id).classList.toggle('open');
}

// ── Logging ──────────────────────────────────────────────────────────
function logEvent(dir, text) {
  const log   = document.getElementById('debug-log');
  const now   = new Date().toLocaleTimeString('en-GB', { hour12:false });
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const ts  = document.createElement('span');
  ts.className   = 'log-ts';
  ts.textContent = now;
  const msg = document.createElement('span');
  msg.className   = 'log-' + dir;
  msg.textContent = text;
  entry.appendChild(ts);
  entry.appendChild(msg);
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Chat bubbles ─────────────────────────────────────────────────────
function addBubble(type, text, dimmed) {
  const w = document.createElement('div');
  w.className = 'bubble ' + type;
  if (dimmed) w.style.opacity = '0.55';
  if (type !== 'system') {
    const l = document.createElement('div');
    l.className = 'blbl';
    l.textContent = type === 'agent' ? 'Agent' : 'You';
    w.appendChild(l);
  }
  const t = document.createElement('div');
  t.textContent = text;
  w.appendChild(t);
  chatBox.appendChild(w);
  chatBox.scrollTop = chatBox.scrollHeight;
  return w;
}

function addReplayDivider() {
  const d = document.createElement('div');
  d.className = 'replay-div';
  d.innerHTML = '<span>↑ previous session ↑</span>';
  chatBox.appendChild(d);
}

// ── Chart palette & defaults ─────────────────────────────────────────
const PAL = ['#58a6ff','#3fb950','#d29922','#f85149',
             '#bc8cff','#39d5ff','#ff7b72','#ffa657'];

const CDEFAULTS = {
  plugins: {
    legend:  { labels:{ color:'#768390', font:{ size:10 } } },
    tooltip: { backgroundColor:'#1c2330', titleColor:'#cdd9e5', bodyColor:'#768390',
               borderColor:'#272e38', borderWidth:1 }
  },
  scales: {
    x:{ ticks:{ color:'#768390', font:{ size:10 } }, grid:{ color:'#1c2330' } },
    y:{ ticks:{ color:'#768390', font:{ size:10 } }, grid:{ color:'#1c2330' } }
  }
};

// ── Column detection ─────────────────────────────────────────────────
function detectCols(rows) {
  if (!rows || !rows.length) return { labelKey:null, valueKeys:[] };
  const first = rows[0], keys = Object.keys(first);
  let labelKey = null;
  const valueKeys = [];
  for (const k of keys) {
    if (typeof first[k] === 'number' && isFinite(first[k])) valueKeys.push(k);
    else if (!labelKey) labelKey = k;
  }
  if (!labelKey && valueKeys.length) labelKey = '_idx';
  return { labelKey, valueKeys };
}
function getLabels(rows, lk) {
  return lk === '_idx' ? rows.map((_,i)=>String(i+1)) : rows.map(r=>String(r[lk]??''));
}
function fmtNum(n) {
  if (Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+'M';
  if (Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'K';
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

// ── Build chart config (shared) ──────────────────────────────────────
function buildChartCfg(type, rows, stacked) {
  const { labelKey, valueKeys } = detectCols(rows);
  if (!rows.length || !valueKeys.length) return null;
  const labels   = getLabels(rows, labelKey);
  const datasets = valueKeys.map((k,i) => ({
    label:           k.replace(/_/g,' '),
    data:            rows.map(r=>r[k]??0),
    backgroundColor: PAL[i%PAL.length]+'cc',
    borderColor:     PAL[i%PAL.length],
    borderWidth:     1,
    borderRadius:    2,
    tension:         0.3,
    fill:            type==='line' && valueKeys.length===1,
    pointRadius:     type==='line' && rows.length>40 ? 0 : 3,
  }));
  return {
    type,
    data: { labels, datasets },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      animation:           { duration:400 },
      plugins:             { ...CDEFAULTS.plugins, ...(stacked?{}:{}) },
      scales:              type==='doughnut' ? undefined : {
        x:{ ...CDEFAULTS.scales.x, stacked },
        y:{ ...CDEFAULTS.scales.y, stacked },
      }
    }
  };
}

function buildPieCfg(rows) {
  const { labelKey, valueKeys } = detectCols(rows);
  if (!rows.length || !valueKeys.length) return null;
  const labels = getLabels(rows, labelKey);
  const values = rows.map(r=>r[valueKeys[0]]??0);
  return {
    type: 'doughnut',
    data: { labels, datasets:[{ data:values,
      backgroundColor: labels.map((_,i)=>PAL[i%PAL.length]+'cc'),
      borderColor:     labels.map((_,i)=>PAL[i%PAL.length]),
      borderWidth:1 }] },
    options: { responsive:true, maintainAspectRatio:false,
               animation:{duration:400}, plugins:CDEFAULTS.plugins }
  };
}

// ── Inline chart in chat bubble ───────────────────────────────────────
function renderInlineChart(bubbleEl, widgetType, result, query) {
  if (!result || !result.length) return;
  const wt = (widgetType||'').toUpperCase();

  const wrap = document.createElement('div');
  wrap.className = 'chat-chart-wrap';

  // "Add to canvas" button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-to-canvas-btn';
  addBtn.textContent = '+ Canvas';
  addBtn.addEventListener('click', () => addToCanvas(widgetType, result, query));
  wrap.appendChild(addBtn);

  if (wt === 'KPI') {
    const { valueKeys, labelKey } = detectCols(result);
    const pk  = valueKeys[0] || Object.keys(result[0])[0];
    const val = result[0][pk];
    const kpiDiv = document.createElement('div');
    kpiDiv.className = 'chat-kpi-inline';
    kpiDiv.innerHTML =
      `<div class="kv">${typeof val==='number'?fmtNum(val):val}</div>` +
      `<div class="kl">${pk.replace(/_/g,' ')}</div>`;
    wrap.appendChild(kpiDiv);
  } else {
    let cfg = null;
    if      (wt==='BARCHART')   cfg = buildChartCfg('bar',     result, false);
    else if (wt==='STACKEDBAR') cfg = buildChartCfg('bar',     result, true);
    else if (wt==='LINECHART')  cfg = buildChartCfg('line',    result, false);
    else if (wt==='PIECHART')   cfg = buildPieCfg(result);
    else                        cfg = buildChartCfg('bar',     result, false);

    if (cfg) {
      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      new Chart(canvas, cfg);
    }
  }

  bubbleEl.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// ── Canvas: drag & resize ────────────────────────────────────────────
let activeWidget = null;
let dragOffX = 0, dragOffY = 0;

document.addEventListener('mousemove', e => {
  if (!activeWidget) return;
  const ca  = document.getElementById('canvas-area');
  const box = ca.getBoundingClientRect();
  let x = e.clientX - box.left - dragOffX;
  let y = e.clientY - box.top  - dragOffY;
  x = Math.max(0, Math.min(x, box.width  - activeWidget.offsetWidth));
  y = Math.max(0, Math.min(y, box.height - activeWidget.offsetHeight));
  activeWidget.style.left = x + 'px';
  activeWidget.style.top  = y + 'px';
});
document.addEventListener('mouseup', () => {
  if (activeWidget) {
    activeWidget.classList.remove('active');
    activeWidget = null;
  }
});

function makeWidgetDraggable(el) {
  const hdr = el.querySelector('.cw-header');
  hdr.addEventListener('mousedown', e => {
    e.preventDefault();
    activeWidget = el;
    el.classList.add('active');
    // bring to front
    el.style.zIndex = ++widgetCounter + 10;
    const rect = el.getBoundingClientRect();
    const ca   = document.getElementById('canvas-area').getBoundingClientRect();
    dragOffX = e.clientX - rect.left;
    dragOffY = e.clientY - rect.top;
  });
}

// chart instances keyed by widget id for cleanup
const chartInstances = {};

function addToCanvas(widgetType, result, query) {
  const ca  = document.getElementById('canvas-area');
  const wt  = (widgetType||'CHART').toUpperCase();
  const id  = 'cw-' + (++widgetCounter);

  // hide empty state
  document.getElementById('canvas-empty').style.opacity = '0';

  // place offset from last widget
  const offsetX = 40 + ((widgetCounter - 1) % 5) * 20;
  const offsetY = 40 + ((widgetCounter - 1) % 5) * 20;

  const widget = document.createElement('div');
  widget.className = 'canvas-widget';
  widget.id = id;
  widget.style.left   = offsetX + 'px';
  widget.style.top    = offsetY + 'px';
  widget.style.width  = wt === 'KPI' ? '200px' : '380px';
  widget.style.height = wt === 'KPI' ? '140px' : '240px';

  // header
  const hdr = document.createElement('div');
  hdr.className = 'cw-header';
  hdr.innerHTML =
    `<span class="cw-type-badge">${wt}</span>` +
    `<span class="cw-title">${escHtml(query||wt)}</span>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'cw-close';
  closeBtn.textContent = '×';
  closeBtn.addEventListener('click', () => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
    widget.remove();
    // restore empty hint if no widgets remain
    if (!ca.querySelector('.canvas-widget')) {
      document.getElementById('canvas-empty').style.opacity = '1';
    }
  });
  hdr.appendChild(closeBtn);
  widget.appendChild(hdr);

  // body
  const body = document.createElement('div');
  body.className = 'cw-body';

  if (wt === 'KPI') {
    const { valueKeys } = detectCols(result);
    const pk  = valueKeys[0] || Object.keys(result[0])[0];
    const val = result[0]?.[pk];
    const extras = [];
    if (result.length > 1) {
      result.slice(0, 5).forEach(r => {
        const lk = Object.keys(r).find(k => typeof r[k] !== 'number') || pk;
        extras.push(`${r[lk]}: ${fmtNum(r[pk])}`);
      });
    }
    const kpiDiv = document.createElement('div');
    kpiDiv.className = 'kpi-canvas';
    kpiDiv.innerHTML =
      `<div class="kv">${typeof val==='number'?fmtNum(val):val}</div>` +
      `<div class="kl">${pk.replace(/_/g,' ')}</div>` +
      (extras.length ? `<div class="ks">${extras.join('  ·  ')}</div>` : '');
    body.appendChild(kpiDiv);
  } else {
    let cfg = null;
    if      (wt==='BARCHART')   cfg = buildChartCfg('bar',  result, false);
    else if (wt==='STACKEDBAR') cfg = buildChartCfg('bar',  result, true);
    else if (wt==='LINECHART')  cfg = buildChartCfg('line', result, false);
    else if (wt==='PIECHART')   cfg = buildPieCfg(result);
    else                        cfg = buildChartCfg('bar',  result, false);

    if (cfg) {
      cfg.options.animation = { duration: 600 };
      const canvas = document.createElement('canvas');
      body.appendChild(canvas);
      // defer chart creation so the element has dimensions
      requestAnimationFrame(() => {
        chartInstances[id] = new Chart(canvas, cfg);
      });
    }
  }

  widget.appendChild(body);
  ca.appendChild(widget);
  makeWidgetDraggable(widget);

  // Listen for resize (ResizeObserver) to notify Chart.js
  if (wt !== 'KPI') {
    const ro = new ResizeObserver(() => {
      if (chartInstances[id]) chartInstances[id].resize();
    });
    ro.observe(widget);
  }

  logEvent('out', `Widget placed on canvas: ${wt}`);
}

// ── State panel update ───────────────────────────────────────────────
function updateState(s) {
  if (!s) return;

  // completeness meter
  const pct  = s.completeness || 0;
  const fill = document.getElementById('prog-fill');
  const gate = document.getElementById('meter-gate');
  document.getElementById('meter-val').textContent = pct.toFixed(1);
  fill.style.width = (pct * 100).toFixed(0) + '%';
  if (pct >= 0.9) {
    fill.style.background = 'var(--green)';
    gate.textContent = '✓ confirmed'; gate.style.color = 'var(--green)';
  } else if (pct > 0.5) {
    fill.style.background = 'var(--orange)';
    gate.textContent = 'needs > 0.80'; gate.style.color = 'var(--orange)';
  } else {
    fill.style.background = 'var(--text-muted)';
    gate.textContent = ''; 
  }

  // slots
  const wEl = document.getElementById('slot-widget');
  wEl.textContent = s.widget || '—';
  wEl.className   = 'slot-val ' + (s.widget ? 'filled' : 'empty');

  const qEl = document.getElementById('slot-query');
  qEl.textContent = s.query || '—';
  qEl.className   = 'slot-val ' + (s.query ? 'filled' : 'empty');

  const cEl = document.getElementById('slot-confirmed');
  if (s.confirmed) {
    cEl.textContent = 'Confirmed'; cEl.className = 'badge confirmed';
  } else if (s.widget || s.query) {
    cEl.textContent = 'Waiting';   cEl.className = 'badge pending';
  } else {
    cEl.textContent = 'Pending';   cEl.className = 'badge inactive';
  }

  // SQL
  if (s.sql && !s.sql.startsWith('--') && !s.sql.startsWith('INSUFFICIENT')) {
    document.getElementById('sql-code').textContent = s.sql;
    const conf = s.sql_confidence != null ? `conf ${(s.sql_confidence*100).toFixed(0)}%` : 'ready';
    document.getElementById('sql-conf-label').textContent = conf;
    // auto-open SQL section
    document.getElementById('sec-sql').classList.add('open');
    if (s.sql_data_errors) {
      const errRow = document.getElementById('sql-err-row');
      errRow.textContent = '⚠ ' + s.sql_data_errors;
      errRow.style.display = 'block';
    }
    logEvent('out', 'SQL ready' + (s.sql_confidence ? ` (${(s.sql_confidence*100).toFixed(0)}% conf)` : ''));
    if (s.sql_data_errors) logEvent('err', s.sql_data_errors);
  }
}

// ── WebSocket ────────────────────────────────────────────────────────
ws.onopen = () => {
  document.getElementById('conn-dot').className  = 'live';
  document.getElementById('conn-label').textContent = 'live';
  logEvent('sys', 'connected → ' + chatId);
};

ws.onmessage = (event) => {
  const data     = JSON.parse(event.data);
  const sender   = data.sender;
  const isReplay = data.system_status === null;

  if (isReplay && !replayDone) {
    addBubble(sender, data.message, true);
    logEvent('in', `[replay] ${sender}: ${data.message.slice(0,60)}`);
    return;
  }

  if (!replayDone && !isReplay) {
    if (chatBox.children.length > 0) addReplayDivider();
    replayDone = true;
    input.disabled   = false;
    sendBtn.disabled = false;
    input.focus();
  }

  const bubbleEl = addBubble(sender === 'user' ? 'user' : 'agent', data.message, false);
  const s = data.system_status;

  // Render inline chart in bubble when result arrives
  if (s && s.result && s.result.length && s.widget) {
    renderInlineChart(bubbleEl, s.widget, s.result, s.query);
  }

  updateState(s);
  logEvent('in', `${sender}: ${data.message.slice(0,70)}`);
};

ws.onerror = () => {
  document.getElementById('conn-dot').className = 'error';
  document.getElementById('conn-label').textContent = 'error';
  addBubble('system', 'Connection error — refresh to reconnect.');
  logEvent('err', 'WebSocket error');
};

ws.onclose = () => {
  document.getElementById('conn-dot').className = '';
  document.getElementById('conn-label').textContent = 'closed';
  addBubble('system', 'Session ended.');
  sendBtn.disabled = true; input.disabled = true;
  logEvent('sys', 'disconnected');
};

// ── Send ─────────────────────────────────────────────────────────────
function sendMessage() {
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(text);
  addBubble('user', text, false);
  logEvent('out', 'user: ' + text.slice(0,70));
  input.value = '';
}
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });

// ── Copy SQL ──────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('sql-code').textContent).then(() => {
    this.textContent = 'Copied!';
    setTimeout(() => { this.textContent = 'Copy'; }, 1800);
  });
});

const themes = {
  dark: {
    "--bg": "#0b0f14",
    "--canvas-bg": "#0d1117",
    "--surface": "#161b22",
    "--surface-2": "#1c2330",
    "--border": "#272e38",
    "--text": "#cdd9e5",
    "--text-dim": "#768390",
    "--accent": "#58a6ff"
  },

  light: {
    "--bg": "#f3f4f6",
    "--canvas-bg": "#ffffff",
    "--surface": "#ffffff",
    "--surface-2": "#f1f5f9",
    "--border": "#d1d5db",
    "--text": "#111827",
    "--text-dim": "#6b7280",
    "--accent": "#2563eb"
  },

  blue: {
    "--bg": "#0f172a",
    "--canvas-bg": "#172554",
    "--surface": "#1e293b",
    "--surface-2": "#334155",
    "--border": "#475569",
    "--text": "#e2e8f0",
    "--text-dim": "#94a3b8",
    "--accent": "#3b82f6"
  },

  green: {
    "--bg": "#07140c",
    "--canvas-bg": "#0c1f12",
    "--surface": "#102516",
    "--surface-2": "#16321f",
    "--border": "#245032",
    "--text": "#d8ffe5",
    "--text-dim": "#8ab89a",
    "--accent": "#3fb950"
  }
};
function applyTheme(themeName) {
  const theme = themes[themeName];

  Object.entries(theme).forEach(([key, value]) => {
    document.documentElement.style.setProperty(key, value);
  });

  localStorage.setItem("theme", themeName);

  document.querySelectorAll(".theme-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  document
    .querySelector(`[data-theme="${themeName}"]`)
    ?.classList.add("active");
}

document.querySelectorAll(".theme-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    applyTheme(btn.dataset.theme);
  });
});

window.addEventListener("load", () => {
  applyTheme(
    localStorage.getItem("theme") || "dark"
  );
});
</script>
</body>
</html>
